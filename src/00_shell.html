<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Garage to Glory - V__VERSION__</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
<style>
:root {
  --bg: #0f1420; --bg2: #161d2e; --panel: #1c2438; --panel2: #243050; --line: #34426a;
  --text: #f3efe6; --dim: #a9b1c6; --faint: #6f7a96;
  --amber: #ffb347; --red: #e0403a; --green: #57c77a; --blue: #4f8cff; --purple: #9b6bff;
  --good: #57c77a; --bad: #ff6b5e;
  --r: 14px; --tap: 48px; --gutter: 16px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 var(--font); overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; }
input, textarea { font: inherit; -webkit-user-select: text; user-select: text; }
#app { position: fixed; inset: 0; overflow: hidden; }
#scene { position: absolute; inset: 0; }
#scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#hud { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
#screens { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
#screens > * { pointer-events: auto; }
#toast { position: absolute; left: 50%; bottom: calc(96px + var(--safe-bot)); transform: translateX(-50%); z-index: 40; pointer-events: none; }
#boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; z-index: 50; background: var(--bg); }
#boot .t { font: 900 28px var(--display); letter-spacing: 1px; }
#boot .s { color: var(--dim); font-size: 14px; }
/* ---- UI styles (owned by 50_ui_*; keep tokens above) ---- */
/* Layers: #scene (3D) < #hud (top bar + dock) < #screens (full screens, sheets, modals) < #fx (bubbles) < #toast */
#toast { top: calc(var(--safe-top) + 64px); bottom: auto; width: calc(100% - 2 * var(--gutter)); max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#fx { position: absolute; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
.dim { color: var(--dim); } .faint { color: var(--faint); } .amber { color: var(--amber); }
.good { color: var(--good); } .bad { color: var(--bad); }
.small { font-size: 13px; } .tiny { font-size: 11px; }
.caps { text-transform: uppercase; letter-spacing: .08em; font-weight: 800; font-size: 11px; color: var(--faint); }
.display { font-family: var(--display); font-weight: 900; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; }
.row { display: flex; align-items: center; gap: 10px; } .grow { flex: 1 1 auto; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; } .stack.tight { gap: 6px; }
.center { text-align: center; }
.sep { height: 1px; background: var(--line); margin: 4px 0; border: 0; }

/* ---- Buttons ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); min-width: 48px; padding: 0 18px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer;
  font: 800 15px/1.1 var(--font); text-transform: uppercase; letter-spacing: .05em; text-align: center; transition: transform .06s, filter .12s; }
.btn:active:not(:disabled) { transform: translateY(2px); filter: brightness(.92); }
.btn:disabled { opacity: .42; cursor: default; }
.btn.block { display: flex; width: 100%; }
.btn.big { min-height: 58px; font-size: 17px; border-radius: 14px; }
.btn.primary { background: var(--amber); color: #1d1204; border-color: #ffc978; box-shadow: 0 4px 0 #b3661a, 0 10px 24px rgba(255, 179, 71, .18); }
.btn.primary:active:not(:disabled) { box-shadow: 0 2px 0 #b3661a; }
.btn.primary:disabled { box-shadow: none; }
.btn.ghost { background: transparent; }
.btn.danger { background: #3a1a22; border-color: #7a2c35; color: #ffb3aa; }
.btn.small { min-height: 44px; font-size: 13px; padding: 0 14px; }
.icon-btn { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg2); color: var(--text);
  font-size: 20px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.icon-btn:active { filter: brightness(1.2); }

/* ---- Panels, chips, meters, avatars ---- */
.panel { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.panel.warm { background: linear-gradient(160deg, #2a2330, #1d2033); border-color: #5a4a3c; }
.panel.alert { background: #2a1820; border-color: #6d2f3a; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font: 800 10px/1.6 var(--font); letter-spacing: .08em; text-transform: uppercase;
  background: var(--panel2); color: var(--dim); border: 1px solid var(--line); white-space: nowrap; }
.tag.amber { color: #1d1204; background: var(--amber); border-color: var(--amber); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font: 700 13px/1.3 var(--font);
  background: var(--panel2); border: 1px solid var(--line); white-space: nowrap; }
.chip.up { color: #9df0b5; background: rgba(87, 199, 122, .12); border-color: rgba(87, 199, 122, .35); }
.chip.down { color: #ffaaa2; background: rgba(255, 107, 94, .12); border-color: rgba(255, 107, 94, .35); }
.bar { position: relative; height: 8px; border-radius: 99px; background: #0b0f19; overflow: hidden; border: 1px solid rgba(255, 255, 255, .06); }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--amber); transition: width .4s; }
.avatar { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font: 900 15px var(--display); letter-spacing: .02em; border: 2px solid rgba(255, 255, 255, .18); box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
.avatar.sm { width: 32px; height: 32px; font-size: 12px; }
.avatar.lg { width: 56px; height: 56px; font-size: 19px; }

/* ---- Screen layers ---- */
.layer { position: absolute; inset: 0; isolation: isolate; }   /* each screen its own stacking context (sticky tabs never poke through a sheet above) */
#screens > .layer[inert] { pointer-events: none; }
/* Sheets leave the HUD bar tappable (menu, stat help) while they're open; modals and full screens cover everything. */
#screens > .sheet-layer { pointer-events: none; } #screens > .sheet-layer > * { pointer-events: auto; }
.hud-on .sheet-layer .scrim { top: calc(var(--safe-top) + 60px); }
.scrim { position: absolute; inset: 0; background: rgba(6, 9, 16, .28); animation: gg-fade .2s ease-out; }
.modal-layer .scrim { background: rgba(6, 9, 16, .66); }
.full { position: absolute; inset: 0; display: flex; flex-direction: column; background: radial-gradient(120% 70% at 50% 0%, #22304f 0%, var(--bg) 62%); animation: gg-fade .18s ease-out; }
.full-body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: calc(var(--safe-top) + 20px) var(--gutter) 16px; overscroll-behavior: contain; }
.full-foot { flex: 0 0 auto; padding: 10px var(--gutter) calc(var(--safe-bot) + 16px); display: flex; flex-direction: column; gap: 10px; }
.full-foot:empty { display: none; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - var(--safe-top) - 72px); display: flex; flex-direction: column;
  background: linear-gradient(180deg, #202a42 0%, var(--panel) 90px); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0;
  box-shadow: 0 -12px 40px rgba(0, 0, 0, .5); animation: gg-up .22s cubic-bezier(.2, .9, .3, 1); }
.sheet.tall { height: calc(100% - var(--safe-top) - 72px); }
.sheet-grip { width: 42px; height: 5px; border-radius: 9px; background: var(--line); margin: 8px auto 0; flex: 0 0 auto; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 6px 10px 8px var(--gutter); flex: 0 0 auto; min-height: 56px; }
.sheet-head h2 { flex: 1 1 auto; font: 900 20px/1.1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
.sheet-head .sub { display: block; font: 700 11px/1.3 var(--font); letter-spacing: .1em; color: var(--amber); margin-bottom: 2px; }
.sheet-body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 2px var(--gutter) 14px; overscroll-behavior: contain; }
.sheet-foot { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px var(--gutter) calc(var(--safe-bot) + 14px); border-top: 1px solid rgba(255, 255, 255, .06); }
.sheet-foot:empty { display: none; }
.modal-layer { display: flex; align-items: center; justify-content: center; padding: var(--gutter); }
.modal { position: relative; width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .6); animation: gg-pop .18s ease-out; display: flex; flex-direction: column; gap: 12px; }
.modal h2 { font: 900 20px/1.15 var(--display); text-transform: uppercase; }
.modal .sheet-foot, .modal .modal-foot { padding: 0; border: 0; display: flex; gap: 10px; }
.modal-foot > .btn { flex: 1 1 0; }
@keyframes gg-up { from { transform: translateY(40%); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes gg-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes gg-pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes gg-in { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes gg-glow { 0%, 100% { box-shadow: 0 4px 0 #b3661a, 0 0 0 0 rgba(255, 179, 71, .45); } 50% { box-shadow: 0 4px 0 #b3661a, 0 0 0 8px rgba(255, 179, 71, 0); } }

/* ---- Toasts and speech bubbles ---- */
.toast { max-width: 100%; padding: 10px 14px; border-radius: 12px; background: rgba(12, 16, 27, .94); border: 1px solid var(--line); border-left: 4px solid var(--amber);
  font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); animation: gg-in .2s ease-out; transition: opacity .3s; }
.toast b { color: var(--amber); }
.toast.bad { border-left-color: var(--bad); } .toast.good { border-left-color: var(--good); }
.toast.out { opacity: 0; }
.bubble { position: absolute; max-width: 240px; padding: 9px 12px; border-radius: 14px; background: #f3efe6; color: #151a26; font-size: 14px; font-weight: 600;
  box-shadow: 0 8px 20px rgba(0, 0, 0, .45); transform: translate(-50%, -100%); animation: gg-pop .16s ease-out; transition: opacity .3s; }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #f3efe6; }
.bubble b { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #8a5a14; }
.bubble.out { opacity: 0; }

/* ---- Tabs ---- */
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
.tab { flex: 1 1 0; min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--dim); font: 800 13px var(--font);
  text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
.tab.on { background: var(--panel2); color: var(--text); box-shadow: inset 0 -2px 0 var(--amber); }

/* ---- HUD + dock ---- */
.hud-bar { display: flex; gap: 4px; padding: calc(var(--safe-top) + 8px) 8px 0; }
.hud-chip { flex: 1 1 0; min-width: 0; min-height: 48px; padding: 5px 4px 4px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .1);
  background: rgba(13, 18, 30, .78); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: var(--text); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.hud-chip .l { font: 800 9px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
.hud-chip .v { font: 800 14px/1.15 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.hud-chip .bar { width: 80%; height: 4px; margin-top: 2px; }
.hud-chip.week .v { color: var(--amber); }
.hud-chip.neg .v { color: var(--bad); }
.hud-menu { flex: 0 0 48px; width: 48px; min-height: 48px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .1); background: rgba(13, 18, 30, .78);
  color: var(--text); font-size: 22px; cursor: pointer; padding: 0; }
.dock { position: fixed; left: var(--gutter); right: var(--gutter); bottom: calc(var(--safe-bot) + 16px); display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
#hud > .dock { pointer-events: none; } .dock > * { pointer-events: auto; }   /* only the pill + button block canvas taps */
.dock .hint { align-self: center; padding: 5px 12px; border-radius: 99px; background: rgba(13, 18, 30, .78); color: var(--dim); font-size: 13px; text-align: center; }
.dock .btn.primary { animation: gg-glow 2.4s ease-in-out infinite; }
.hidden { display: none !important; }

/* ---- Title + menus ---- */
.title-wrap { position: relative; z-index: 1; min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-bottom: 8px; }
.logo { text-align: center; font: 900 58px/.9 var(--display); letter-spacing: .01em; text-transform: uppercase; color: var(--text);
  text-shadow: 0 4px 0 #0a0d16, 0 0 30px rgba(255, 179, 71, .25); }
.logo .to { display: block; font-size: 24px; color: var(--amber); letter-spacing: .4em; margin: 6px 0 4px; text-shadow: none; }
.logo .glory { color: var(--amber); }
.tagline { text-align: center; color: var(--dim); font-size: 15px; max-width: 300px; margin: 0 auto; }
.credit { text-align: center; color: var(--faint); font-size: 12px; letter-spacing: .04em; }
.title-bg { position: absolute; inset: auto 0 0 0; height: 44%; pointer-events: none; opacity: .5;
  background: repeating-linear-gradient(180deg, transparent 0 34px, rgba(0, 0, 0, .35) 34px 38px), linear-gradient(180deg, transparent, #1a2236 30%, #121829);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%); mask-image: linear-gradient(180deg, transparent, #000 40%); }
.title-glow { position: absolute; left: 50%; top: 18%; width: 300px; height: 300px; margin-left: -150px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255, 179, 71, .22), transparent 65%); }
.menu-list { display: flex; flex-direction: column; gap: 10px; }
.slot-btn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--bg2); color: var(--text); text-align: left; cursor: pointer; }
.slot-btn:active:not(:disabled) { filter: brightness(1.15); }
.slot-btn:disabled { opacity: .45; }
.slot-btn .n { flex: 0 0 40px; height: 40px; border-radius: 10px; background: var(--panel2); display: flex; align-items: center; justify-content: center; font: 900 16px var(--display); color: var(--amber); }
.slot-btn .t { font-weight: 800; } .slot-btn .d { font-size: 13px; color: var(--dim); }
.back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.screen-h { font: 900 30px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.screen-sub { color: var(--dim); font-size: 15px; margin-top: 6px; }

/* ---- New career: genre, intro, creator, cold open ---- */
.genre-card { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 96px; padding: 14px; border-radius: 16px; text-align: left;
  border: 2px solid var(--line); background: var(--bg2); color: var(--text); cursor: pointer; }
.genre-card.live { border-color: var(--amber); background: linear-gradient(135deg, #3a2a18, #1c2438 70%); box-shadow: 0 6px 22px rgba(255, 179, 71, .15); }
.genre-card:disabled { cursor: default; opacity: .6; filter: saturate(.4); }
.genre-card .ico { flex: 0 0 56px; height: 56px; border-radius: 14px; background: rgba(0, 0, 0, .3); display: flex; align-items: center; justify-content: center; font-size: 30px; }
.genre-card .g { font: 900 22px/1 var(--display); text-transform: uppercase; }
.genre-card .b { font-weight: 700; margin-top: 3px; } .genre-card .c { font-size: 13px; color: var(--dim); }
.genre-card .tag { position: absolute; top: 10px; right: 10px; }
.member-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, .06); }
.member-row:first-child { border-top: 0; }
.member-row .nm { font-weight: 800; } .member-row .rl { font-size: 12px; color: var(--amber); text-transform: uppercase; letter-spacing: .08em; font-weight: 800; }
.member-row .bio { font-size: 13px; color: var(--dim); margin-top: 2px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font: 800 11px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.field input, textarea.code { width: 100%; min-height: 50px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
  font-size: 17px; outline: none; }
.field input:focus, textarea.code:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(255, 179, 71, .18); }
.field .err { color: var(--bad); font-size: 13px; min-height: 18px; }
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.preset { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 150px; padding: 12px 8px 10px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--bg2); color: var(--text); cursor: pointer; text-align: center; }
.preset.on { border-color: var(--amber); background: linear-gradient(180deg, #33291e, var(--bg2)); }
.preset .pn { font-weight: 800; font-size: 14px; line-height: 1.15; } .preset .pb { font-size: 12px; color: var(--dim); line-height: 1.25; }
.fig { position: relative; width: 44px; height: 62px; flex: 0 0 auto; }
.fig .hd { position: absolute; left: 11px; top: 4px; width: 22px; height: 22px; border-radius: 7px; }
.fig .hr { position: absolute; left: 9px; top: 0; width: 26px; height: 11px; border-radius: 7px 7px 3px 3px; }
.fig .bd { position: absolute; left: 6px; top: 27px; width: 32px; height: 21px; border-radius: 6px 6px 3px 3px; }
.fig .lg { position: absolute; left: 10px; top: 48px; width: 24px; height: 14px; border-radius: 2px; }
.fig .kit { position: absolute; right: -8px; bottom: 0; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #0b0f19; }
.fig .sh { position: absolute; left: 12px; top: 11px; width: 20px; height: 6px; border-radius: 2px; background: #0b0f19; }
.cold { position: absolute; inset: 0; display: flex; flex-direction: column; background: radial-gradient(90% 60% at 50% 40%, #1b2440, #070a12); cursor: pointer; }
.cold-top { display: flex; justify-content: space-between; align-items: center; padding: calc(var(--safe-top) + 12px) var(--gutter) 0; }
.cold-text { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 20px 28px; text-align: center;
  font: 800 23px/1.35 var(--font); text-wrap: balance; animation: gg-in .35s ease-out; }
.cold-foot { padding: 0 var(--gutter) calc(var(--safe-bot) + 18px); display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.dots { display: flex; justify-content: center; gap: 6px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); } .dots i.on { background: var(--amber); }
.hail { position: absolute; inset: 0; pointer-events: none; opacity: .35;
  background-image: radial-gradient(circle, #cfe3ff 1.2px, transparent 1.8px), radial-gradient(circle, #cfe3ff 1px, transparent 1.6px);
  background-size: 60px 80px, 90px 110px; background-position: 0 0, 30px 40px; animation: gg-hail 1.2s linear infinite; }
@keyframes gg-hail { to { background-position: -20px 80px, 5px 150px; } }

/* ---- Monday card ---- */
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.card-head .who { font-weight: 800; } .card-head .role { font-size: 12px; color: var(--dim); }
.card-title { font: 900 22px/1.12 var(--display); text-transform: uppercase; margin-bottom: 8px; }
.card-text { font-size: 16px; line-height: 1.45; color: #e7e2d6; margin-bottom: 14px; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 100%; min-height: 64px; padding: 11px 14px; margin-bottom: 10px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--bg2); color: var(--text); text-align: left; cursor: pointer; }
.choice:active:not(:disabled) { border-color: var(--amber); background: #2a2a33; }
.choice .cl { font-weight: 800; font-size: 16px; line-height: 1.25; }
.choice .ch { font-size: 13px; color: var(--amber); line-height: 1.3; }
.quote { position: relative; padding: 14px 16px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); border-left: 4px solid var(--amber); font-size: 16px; line-height: 1.45; }
.you { font-size: 13px; color: var(--dim); margin-bottom: 8px; } .you b { color: var(--text); }

/* ---- Planner ---- */
.gig-box { display: flex; gap: 12px; align-items: flex-start; }
.gig-box .ico { font-size: 26px; line-height: 1; margin-top: 2px; }
