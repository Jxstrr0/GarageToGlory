    { id: 'scene_fruit_basket', type: 'scene', speaker: 'wraith_frontman', title: 'A Fruit Basket from Winnipeg',
      gate: g({ minFans: 40 }),
      text: "A fruit basket arrives. The card: 'Heard great things, buddy! Keep crushing it! Your pals, Tundra Wraith.' " +
        'Someone drew a pentagram with a smiley face in it. The pineapple is perfect.',
      choices: [
        { label: 'Send a thank-you basket', effects: { fund: -40, buzz: 3, chemistry: 2 },
          outcome: 'You send perogies. They send a thank-you card for the thank-you basket. You send a card back. This could go on forever.' },
        { label: 'Post a diss track',
          effects: { buzz: 7, fans: 6, mood: { marcel: 6 },
            chat: { who: 'wraith_frontman', text: 'Sick diss track, buddy!! Shared it with our mailing list. Go Hail Damage! 🤘🙂' } },
          outcome: "Marcel screams four minutes of French insults. Tundra Wraith share it with their whole mailing list and call it 'super fun'. It's worse than losing." },
        { label: 'Eat the fruit. Say nothing.', effects: { burnout: -5, mood: { kenji: 6 } },
          outcome: 'Kenji eats the entire pineapple. How? When? Nobody saw. The top of it sits on his amp like a trophy.' }
      ] },

    { id: 'scene_legion_doreen', type: 'scene', speaker: 'doreen', title: 'Doreen at the Legion',
      gate: g({ minWeek: 4, minFans: 25 }),
      text: "Doreen runs the Legion Hall, Branch 63. She'll give you Saturday night on two conditions: one polka in the set, " +
        "and nobody does 'the throat thing' during the meat draw.",
      choices: [
        { label: 'Book it. Learn a polka.', effects: { book: 'legion_63', skill: { dana: 1 }, mood: { marcel: -4 } },
          outcome: 'Dana learns the polka in eleven minutes and adds a sweep-picked outro. Doreen tolerates it. The meat draw goes smoothly.' },
        { label: 'Book it. Throat thing stays.', hint: "Gamble: Doreen's patience",
          outcome: 'Marcel demonstrates the throat thing over the phone, to be transparent.',
          roll: { chance: 0.5, stat: 'buzz', statScale: 0.006,
            success: { effects: { book: 'legion_63', buzz: 6, mood: { marcel: 6 } },
              outcome: "A long pause. 'My late husband could do that,' says Doreen. You're booked. Marcel is deeply moved." },
            fail: { effects: { mood: { marcel: -5 } },
              outcome: 'Doreen hangs up mid-throat-thing and books a tribute band to a tribute band instead.' } } },
        { label: 'Maybe next time', effects: { burnout: -3 },
          outcome: "Doreen says 'your loss, dear' and books an accordion duo. You hear later that it went off." }
      ] },

    { id: 'scene_st_vlads', type: 'scene', speaker: 'baba', title: 'The Fall Supper', gate: g({ minWeek: 4, weekOfYear: [5, 10] }),
      text: "Baba says St. Vlad's needs music for the fall supper. 'Nothing Satanic. The French one may sing, but only about " +
        "gardening.' Marcel realizes, quietly, that all of his songs already qualify.",
      choices: [
        { label: 'Play the fall supper', effects: { book: 'st_vlads_hall', mood: { jaxon: 8 } },
          outcome: "Baba tells the whole parish her grandson is in a 'Christian lawn band'. Nobody corrects her. Nobody would dare." },
        { label: 'Politely decline', effects: { mood: { jaxon: -6 } },
          outcome: "Baba says 'okay' in a way that means the opposite. Jaxon's lunch the next day is a single dry cracker." }
      ] },

    { id: 'scene_bonspiel', type: 'scene', speaker: 'barb', title: 'Bonspiel Social', gate: g({ minFans: 60, weekOfYear: [12, 18] }),
      text: "Barb from the Warman Curling Rink wants a band for the bonspiel social: forty curlers, all named Barb or Dale. " +
        "'Metal's fine,' she says. 'We had a polka band last year. Nearly lost the roof.'",
      choices: [
        { label: 'Book the bonspiel', effects: { book: 'warman_curling_lounge', burnout: 3 },
          outcome: "Barb books you for Saturday. Jaxon asks if he can curl between sets. Barb says 'we'll see about you'." },
        { label: 'Book it and enter the draw', hint: 'Gamble: can a metal band curl?',
          outcome: 'Barb hands out brooms. Marcel holds his like a wizard staff.',
          roll: { chance: 0.45, stat: 'chemistry', statScale: 0.008,
            success: { effects: { book: 'warman_curling_lounge', fans: 12, chemistry: 5 },
              outcome: 'Kenji skips. Dana sweeps like it is a solo. You win the C event and a pro-shop gift card. Warman adopts you.' },
            fail: { effects: { book: 'warman_curling_lounge', burnout: 8, mood: { marcel: -4 } },
              outcome: "Marcel slides out of the hack in full eyeliner and doesn't stop until the far wall. You still get the gig. Barb calls it 'a lot'." } } },
        { label: 'Pass on Warman', effects: { burnout: -3 },
          outcome: 'Barb books the polka band again. You hear the roof held, barely.' }
      ] },

    { id: 'scene_ukrainian_christmas', type: 'scene', speaker: 'baba', title: 'Ukrainian Christmas Eve',
      gate: g({ weekOfYear: [12, 14] }),
      text: "Baba invites the whole band to Ukrainian Christmas Eve on January 6th. Twelve meatless dishes. Kenji arrives with " +
        'a thirteenth. Nobody knows what it is. Baba tries it and nods at him. He nods back.',
      choices: [
        { label: 'Stay all night', effects: { chemistry: 6, burnout: -6, mood: { jaxon: 8 } },
          outcome: "Kutia, cabbage rolls, three kinds of perogies and carols in Ukrainian. Marcel harmonizes in French. Baba declares him 'acceptable'." },
        { label: 'Play carols for the family', effects: { fans: 10, buzz: 3, mood: { jaxon: 6 } },
          outcome: 'A metal carol set in Baba\'s living room. Fourteen cousins are now fans. One of them runs a bar in Yorkton.' },
        { label: 'Bring Baba a gift', effects: { fund: -40, mood: { jaxon: 10 }, chemistry: 3 },
          outcome: "Chocolates and a signed set list. Baba puts the set list on the fridge, next to Jaxon's grade three report card." }
      ] },

    { id: 'scene_open_mic', type: 'scene', speaker: 'jaxon', title: 'Open Mic Night', once: false, cooldown: 8,
      gate: g({ minWeek: 6, minFans: 20 }),
      text: "Open mic night at The Gopher Hole. The sign-up sheet: a poet, two acoustic guitars and a man who plays spoons. " +
        "The host says you get 'two songs, no pyro and please, no French'.",
      choices: [
        { label: 'Two songs, full volume', effects: { fans: 6, buzz: 4, burnout: 4 },
          outcome: "The spoons man is visibly shaken. The poet writes a poem about you on the spot. It rhymes 'abyss' with 'hiss'." },
        { label: 'Two songs, both in French', effects: { buzz: 6, mood: { marcel: 8 } },
          outcome: "Marcel sings both in French, out of spite. The host lets it go. Half the room thinks it's poetry night and snaps politely." },
        { label: 'Just watch the spoons guy', effects: { burnout: -4, chemistry: 3 },
          outcome: "He's incredible. Kenji buys him a drink. Nobody has ever seen Kenji buy anyone a drink." }
      ] },

    { id: 'scene_wraith_visit', type: 'scene', speaker: 'wraith_frontman', title: 'Buddy Drops By',
      gate: g({ minWeek: 12, minFans: 120 }),
      text: "Tundra Wraith are in town to play The Gopher Hole. Their frontman drops by the garage in full corpse paint and a " +
        "cardigan. He brought muffins. He asks if you're keeping receipts. 'You guys are gonna go places, buddy!'",
      choices: [
        { label: 'Ask for an opening slot', hint: "Gamble: he's too polite to say no",
          outcome: 'You ask. He beams through the corpse paint.',
          roll: { chance: 0.5, stat: 'buzz', statScale: 0.006,
            success: { effects: { fans: 20, buzz: 8 },
              outcome: "He gets you ten minutes before their set and yells 'SUPPORT LOCAL, BUDDY!' Twenty of their fans follow you home. Online, mostly." },
            fail: { effects: { buzz: 3, mood: { marcel: -8 } },
              outcome: "He says yes, remembers their contract, then apologizes for eleven minutes. A fruit basket arrives the next day. It's a nice basket." } } },
        { label: 'Challenge him to a scream-off', effects: { mood: { marcel: 8 }, buzz: 6 },
          outcome: 'Marcel screams. The frontman screams back, then apologizes for being loud. He wins anyway. He offers Marcel a lozenge.' },
        { label: 'Accept the muffins', effects: { burnout: -5, chemistry: 3 },
          outcome: "They're really good muffins. Saskatoon berry. That's the worst part. He leaves the recipe." }
      ] },

    { id: 'fame_campus_radio', type: 'fame', speaker: 'dj', title: 'Midnight Mayhem', gate: g({ minFans: 40 }),
      text: "Deb Wiebe hosts 'Midnight Mayhem' on CRUD 90.5 campus radio, Tuesdays at 2 a.m. She wants Hail Damage live in " +

    { id: 'fame_fan_mail', type: 'fame', speaker: 'jaxon', title: 'Our First Fan Letter', gate: g({ minFans: 40 }),

        { label: 'Mail back signed merch', effects: { fund: -25, fans: 8, buzz: 3 },

      ] },

    { id: 'fame_deci_hell', type: 'fame', speaker: 'zine', title: 'Four Skulls', gate: g({ minFans: 100, minWeek: 10 }),
      text: "Deci-Hell, the metal zine photocopied at the downtown library, reviewed your last show: 'Four skulls out of five. " +

        { label: 'Frame it', effects: { buzz: 5, chemistry: 3 },

        { label: 'Work on your drum face', effects: { drumSkill: 2, burnout: 4 },

// economy.js: every tunable number for money, fans, buzz, moods, gigs and the bots (owned by the SIM agent).
// Owner call (2026-09-29): "Scrappy, but not too brutal" = always a little short, hustle matters,
// and a parents' loan is rare with decent play. Tune with `node tools/balance.js [years] [seeds]`.
(function (GG) {
  GG.content.economy = {
    // ---- Career start ----------------------------------------------------
    startFund: 300, startFans: 12, startBuzz: 5,        // twelve fans: your mom counts

    upkeepPerFan: 0.015,       // + this per fan: a bigger band has bigger bills (more gas, more strings, more pizza)
    buzzDecay: 0.15,           // fraction of buzz lost each week (at least 1 while buzz > 0)
    buzzFans: 0.12,            // organic new fans per week per point of buzz
    burnoutRecovery: 3,        // burnout that fades by itself every week
    burnoutMoodAt: 55,         // above this, burnout drags every mood down...
    burnoutMoodPer: 12,        // ...by 1 point per this many points of burnout over the line
    moodBaseline: 60,          // moods drift toward this, adjusted by how the band is doing:
    moodBuzzScale: 0.15,       //   + (buzz - 20) * scale
    moodChemScale: 0.1,        //   + (chemistry - 50) * scale
    moodBurnoutFrom: 35,       //   - (burnout - from) * scale, when burnout is above `from`
    moodBurnoutScale: 0.3,
    moodBaselineRange: [25, 80],
    moodDrift: 0.25,           // fraction of the gap to the baseline closed each week
    chemistryDrift: 0.25,       // chemistry closes this fraction of its gap to the average mood each week

    // ---- Monday (startWeek) ----------------------------------------------
    quietWeekChance: 0.15,     // chance of a Monday with no card
    quietFreeWeeks: 2,         // weeks 1..2 always have a card
    offerMinFans: 40,          // gig offers start arriving at this many fans...
    offerChance: 0.35,         // ...with this chance per week when no gig is booked
    offerMaxTier: 2,
    chainStaleWeeks: 24,       // a chain step that can't fire for this long is ended

    // ---- Parents' loan ---------------------------------------------------
    parentsCushion: 100,       // a loan tops the fund back up to this

    // ---- Group chat, history, milestones ---------------------------------
    chatChance: 0.35,          // per member per week
    chatSecondChance: 0.1,     // ...and a second message
    chatMax: 60, historyMax: 400,
    fanMilestones: [50, 100, 250, 500, 1000], fundMilestone: 1000,

  /* ======================================================================

  /* ======================================================================

     ====================================================================== */
  function makePlayer(p) {
    var presets = GG.content.presets || [], preset = null, i;

    preset = preset || presets[0] || null;

  // args: { seed?, bandId?, slot?, player: { name, nick, presetId } }. Week one comes pre-booked at Buddy's.

      region: 'canada', space: 'parents_garage', members: GENERIC_MEMBERS, starterSongs: [] };
    var seed = args.seed != null ? ((args.seed >>> 0) || 1) : GG.hashSeed((p.name || 'You') + '|' + bandId);
    var state = {

      bandId: bandId, genre: band.genre || 'metal', region: band.region || 'canada', city: band.city || 'Saskatoon',

  /* ======================================================================

  function maybeOffer(state, rng) {

  // Idempotent: calling it again in the same week returns the pending card (or null once resolved) without drawing.
  career.startWeek = function (state) {

      return { card: pending, offer: state.offer, quiet: state.quiet };
    }
    var rng = GG.rngFor(state);
    endStaleChains(state);
    snapshotWeek(state);
    var card = drawCard(state, rng);
    state.card = card ? { id: card.id, resolved: false } : null;

    state.phase = card ? 'monday' : 'plan';

      card: card ? card.id : null, offer: state.offer, quiet: state.quiet });
    return { card: card, offer: state.offer, quiet: state.quiet };
  };

  // Applies choice i of the pending card. Roll choices: choice effects always, then success or fail.
  career.resolveCard = function (state, i) {
    var card = state.card && !state.card.resolved ? career.currentCard(state) : null;
    var choice = card && card.choices && card.choices[i];
    if (!choice) return null;
    var rng = GG.rngFor(state), d = {}, success = null, outcome = choice.outcome || '';
    career.applyEffects(state, choice.effects, d);
    if (choice.roll) {
      success = rng.chance(career.rollChance(state, choice.roll));
      var branch = success ? choice.roll.success : choice.roll.fail;
      if (branch) {
        career.applyEffects(state, branch.effects, d);
        if (branch.outcome) outcome = outcome ? outcome + ' ' + branch.outcome : branch.outcome;
      }
    }
    autoAdvanceChain(state, card, d);
    outcome = career.fillText(state, outcome);
    state.card = { id: card.id, resolved: true, choice: i, outcome: outcome, deltas: d, success: success };
    state.stats.cards++;
    state.phase = 'plan';
    var res = { cardId: card.id, choice: i, outcome: outcome, deltas: d, success: success };
    GG.emit('card:resolved', res);
    changed(state);
    return res;
  };

  career.setPlan = function (state, plan) {
    var out = [];
    for (var i = 0; i < C.BLOCKS_PER_WEEK; i++) out.push(plan && C.ACTIVITIES.indexOf(plan[i]) >= 0 ? plan[i] : null);
    state.plan = out;
    GG.emit('plan:changed', { plan: out });
    return out;
  };

  career.acceptOffer = function (state) {

    changed(state);
    return state.gig;
  };
  career.declineOffer = function (state) {
    var had = !!state.offer;

    changed(state);
    return had;
  };

  /* ======================================================================
     The week: three activity blocks, then the weekend gig
     ====================================================================== */
  function activityLine(state, rng, id) {
    return career.pickLine(state, rng, contentLines('activity', id), FALLBACK_LINES.activity[id]);
  }
  // Each handler: (state, A = activity numbers, f = repeat factor, rng, d = deltas, lines)
  var ACT = {
    rehearse: function (state, A, f, rng, d) {

      addStat(state, 'drumSkill', rngRound(A.drumSkill * f * headroom(state.drumSkill), rng), d);
      addStat(state, 'chemistry', rngRound(A.chemistry * f, rng), d);

      lines.push('New song: “' + song.title + '”' + (song.titleEn && song.titleEn !== song.title ? ' (' + song.titleEn + ')' : '') + '.');

    },

  /* ======================================================================

  }

  /* ======================================================================

  function memberSum(state, map) {

    return t;
  }

    if (!fx) return 0;

    v += (fx.fund || 0) * (state.fund < W.broke ? W.fundBroke : W.fund);
    v += (fx.fans || 0) * W.fans + (fx.buzz || 0) * W.buzz + (fx.chemistry || 0) * W.chemistry;

    want.push('rehearse');

    want.push('write', 'hustle', 'rehearse');

  function avgPlan(state, B, rng) {

<script>/* 21_sim_songs.js */
// 21_sim_songs.js: the song catalog. v0.1: placeholder songs (a title + quality/polish numbers);
// v0.2 adds the step-sequencer `pattern` and rates it. No DOM; randomness only from the rng passed in.

(function (GG) {

      { fr: 'Les Pissenlits Éternels', en: 'The Eternal Dandelions' },
      { fr: 'Tondeuse de l’Apocalypse', en: 'Lawnmower of the Apocalypse' },
      { fr: 'Le Voisin a Coupé Trop Court', en: 'The Neighbour Cut It Too Short' },
      { fr: 'Arrosage Interdit', en: 'Watering Ban' },
      { fr: 'Chiendent Sanglant', en: 'Bloody Crabgrass' }

    punk: [{ fr: 'Council Meeting (Is a Lie)', en: 'Council Meeting (Is a Lie)' }],
    rock: [{ fr: 'Leather Pants at Minus Forty', en: 'Leather Pants at Minus Forty' }],
    country: [{ fr: 'My Truck Is in the Condo Lot', en: 'My Truck Is in the Condo Lot' }]

    var max = 0;

  function pickTitle(state, rng) {

    C: ['You finished every song. Technically.'],

    return null;

<script>/* 30_audio.js */

<script>/* 50_ui_core.js */
// 50_ui_core.js: the reusable UI toolkit. el() DOM helper, a screen stack (full screens, bottom sheets,

// visible above it, 'modal' is a centred dialog. sticky: no close button and the scrim doesn't dismiss it.
// Local events (UI-internal, not in the contract): 'ui:stack' { ids } after every open/close (HUD visibility),

  /* ---- Screen stack ------------------------------------------------------------------------------ */
  var defs = {}, stack = [];
  ui.define = function (id, def) { def.kind = def.kind || 'sheet'; defs[id] = def; };
  ui.defined = function (id) { return !!defs[id]; };
  ui.top = function () { return stack.length ? stack[stack.length - 1].id : null; };
  ui.isOpen = function (id) { return indexOf(id) >= 0; };
  ui.stackIds = function () { return stack.map(function (e) { return e.id; }); };
  ui.hasFull = function () { return stack.some(function (e) { return e.def.kind === 'full'; }); };
  function indexOf(id) { for (var i = 0; i < stack.length; i++) if (stack[i].id === id) return i; return -1; }
  function host() { return document.getElementById('screens'); }

  function frame(e) {
    var d = e.def, closable = !d.sticky;
    if (d.kind === 'full') {
      e.body = el('div.full-body'); e.foot = el('div.full-foot');
      e.root = el('div.layer.full-layer', { data: { screen: e.id } }, el('div.full' + (d.cls ? '.' + d.cls : ''), [e.body, e.foot]));
      return;
    }
    var scrim = el('div.scrim', { onclick: function () { if (closable && ui.top() === e.id) ui.close(e.id); } });
    e.titleEl = el('h2');
    e.body = el('div.sheet-body'); e.foot = el('div.sheet-foot');
    if (d.kind === 'modal') {
      e.body.className = 'modal-body'; e.foot.className = 'modal-foot';
      e.root = el('div.layer.modal-layer', { data: { screen: e.id } }, [scrim, el('section.modal', { role: 'dialog' }, [e.titleEl, e.body, e.foot])]);
      return;
    }
    var head = el('header.sheet-head', [e.titleEl,
      closable && el('button.icon-btn', { testid: 'btn-close', 'aria-label': 'Close', onclick: function () { ui.close(e.id); } }, '✕')]);
    e.root = el('div.layer.sheet-layer', { data: { screen: e.id } },
      [scrim, el('section.sheet' + (d.tall ? '.tall' : '') + (d.cls ? '.' + d.cls : ''), { role: 'dialog' }, [el('div.sheet-grip'), head, e.body, e.foot])]);
  }
  function render(e) {
    var keep = e.body && e.body.scrollTop;
    ui.clear(e.body); ui.clear(e.foot);
    var t = e.def.title;
    e.setTitle(typeof t === 'function' ? t(e.data) : t || '');
    e.def.build(e, e.data);
    if (keep) e.body.scrollTop = keep;
    GG.emit('ui:layout', { id: e.id });
  }
  function makeEntry(id, data) {
    var e = { id: id, def: defs[id], data: data || {} };
    e.setTitle = function (text, sub) {
      if (!e.titleEl) return;
      ui.clear(e.titleEl);
      ui.append(e.titleEl, [sub ? el('span.sub', sub) : null, text || '']);
    };
    e.rerender = function (data) { if (data) e.data = data; if (indexOf(e.id) >= 0) render(e); };
    e.close = function () { ui.close(e.id); };
    return e;
  }
  function afterChange() {
    var coveredBelow = -1;   // screens under the topmost full screen are hidden (no see-through during fades)
    for (var j = stack.length - 1; j >= 0; j--) if (stack[j].def.kind === 'full') { coveredBelow = j; break; }
    for (var i = 0; i < stack.length; i++) {
      var top = i === stack.length - 1;
      stack[i].root.classList.toggle('hidden', i < coveredBelow);
      if (top) stack[i].root.removeAttribute('inert'); else stack[i].root.setAttribute('inert', '');
      stack[i].root.setAttribute('aria-hidden', top ? 'false' : 'true');
    }
    GG.emit('ui:stack', { ids: ui.stackIds() });
  }

  // Opens a screen. If it's already open, everything above it closes and it re-renders with the new data.
  ui.show = function (id, data) {
    if (!defs[id]) { console.warn('[ui] unknown screen', id); return null; }
    var at = indexOf(id);
    if (at >= 0) {
      while (stack.length - 1 > at) ui.close();
      var ex = stack[at]; ex.data = data || ex.data; render(ex); afterChange();
      return ex;
    }
    var e = makeEntry(id, data);
    ui.clearToasts();   // a new screen makes old hints stale (and they'd sit on its header)
    frame(e);
    stack.push(e);
    host().appendChild(e.root);
    render(e);
    afterChange();
    GG.emit('screen:open', { id: id });
    if (e.def.onShow) e.def.onShow(e);
    return e;
  };
  // Closes the top screen, or the screen `id` plus everything stacked above it.
  ui.close = function (id) {
    if (!stack.length) return;
    var at = id ? indexOf(id) : stack.length - 1;
    if (at < 0) return;
    while (stack.length > at) {
      var e = stack.pop();
      if (e.def.onClose) { try { e.def.onClose(e); } catch (err) { console.warn('[ui] onClose', err); } }
      if (e.root.parentNode) e.root.parentNode.removeChild(e.root);
      afterChange();
      GG.emit('screen:close', { id: e.id });
    }
  };
  ui.closeAll = function () { if (stack.length) ui.close(stack[0].id); };
  ui.replace = function (id, data) { if (stack.length) ui.close(); return ui.show(id, data); };
  ui.get = function (id) { var i = indexOf(id); return i >= 0 ? stack[i] : null; };

  /* ---- Confirm dialog ----------------------------------------------------------------------------
     GG.ui.confirm({ title, text, yes: 'Overwrite', no: 'Cancel', danger: true }).then(function (ok) { ... }) */
  ui.define('confirm', {
    kind: 'modal',
    title: function (d) { return d.title || 'Sure?'; },
    build: function (s, d) {
      if (d.text) s.body.appendChild(el('p.dim', d.text));
      var answered = false;
      function answer(v) { if (answered) return; answered = true; s.data._answer = v; ui.close(s.id); }
      ui.append(s.foot, [
        ui.btn('.btn.ghost', { testid: 'btn-confirm-no', onclick: function () { answer(false); } }, d.no || 'Nope'),
        ui.btn('.btn' + (d.danger ? '.danger' : '.primary'), { testid: 'btn-confirm-yes', onclick: function () { answer(true); } }, d.yes || 'Yes')
      ]);
    },
    onClose: function (s) { if (s.data.resolve) s.data.resolve(!!s.data._answer); }
  });
  ui.confirm = function (opts) {
    return new Promise(function (resolve) { ui.show('confirm', Object.assign({}, opts, { resolve: resolve })); });
  };

  /* ---- Toasts and speech bubbles ----------------------------------------------------------------- */
  ui.toast = function (text, opts) {
    opts = opts || {};
    var box = document.getElementById('toast');
    if (!box || !text) return null;
    while (box.children.length >= 3) box.removeChild(box.firstChild);
    var t = el('div.toast' + (opts.kind ? '.' + opts.kind : ''), { role: 'status' }, [opts.who ? el('b', opts.who + ': ') : null, String(text)]);
    box.appendChild(t);
    var ms = opts.ms || Math.min(6000, 2200 + String(text).length * 35);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 320); }, ms);
    return t;
  };
  ui.clearToasts = function () {
    var box = document.getElementById('toast');
    Array.prototype.forEach.call(box ? box.children : [], function (t) { t.classList.add('out'); setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 320); });
  };
  // A speech bubble pointing at a screen position (CSS px), e.g. above a bandmate in the 3D garage.
  var bubbles = {};
  ui.bubble = function (text, pos, who, key) {
    var fx = document.getElementById('fx');
    if (!fx || !pos) return ui.toast(text, { who: who });
    key = key || who || 'x';
    if (bubbles[key] && bubbles[key].parentNode) bubbles[key].parentNode.removeChild(bubbles[key]);
    var w = window.innerWidth || 390;
    var b = el('div.bubble', [who ? el('b', who) : null, String(text)]);
    b.style.left = U.clamp(pos.x, 130, w - 130) + 'px';
    b.style.top = Math.max(120, pos.y - 34) + 'px';
    fx.appendChild(b);
    bubbles[key] = b;
    setTimeout(function () { b.classList.add('out'); setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 320); }, Math.min(5200, 2200 + String(text).length * 30));
    return b;
  };

  /* ---- Small widgets ---------------------------------------------------------------------------- */
  // Segmented tabs. tabs: [{ id, label }]; testids are prefix + id (e.g. 'laptop-tab-chat').
  ui.tabs = function (tabs, active, onPick, prefix) {
    return el('div.tabs', { role: 'tablist' }, tabs.map(function (t) {
      return el('button.tab' + (t.id === active ? '.on' : ''), { type: 'button', role: 'tab', testid: (prefix || 'tab-') + t.id,
        'aria-selected': t.id === active ? 'true' : 'false', onclick: function () { if (t.id !== active) onPick(t.id); } }, t.label);
    }));
  };
  // Horizontal meter 0..max. opts: { color, cls }
  ui.bar = function (value, max, opts) {
    opts = opts || {};
    var pct = U.clamp((Number(value) || 0) / (max || 100) * 100, 0, 100);
    return el('div.bar' + (opts.cls ? '.' + opts.cls : ''), [el('i', { style: { width: pct.toFixed(1) + '%', background: opts.color || '' } })]);
  };
  ui.moodColor = function (mood) { return mood >= 70 ? 'var(--good)' : mood >= 45 ? 'var(--amber)' : mood >= 25 ? '#ff8a4c' : 'var(--bad)'; };
  ui.moodLabel = function (mood) {
    return GG.career && GG.career.moodLabel ? GG.career.moodLabel(mood) : mood >= 70 ? 'happy' : mood >= 45 ? 'ok' : mood >= 25 ? 'grumpy' : 'sulking';
  };
  ui.moodEmoji = function (label) { return { happy: '😄', ok: '🙂', grumpy: '😒', sulking: '😤' }[label] || '🙂'; };

  /* ---- People: names, colours, avatars ------------------------------------------------------------ */
  var PALETTE = ['#e0603a', '#4f8cff', '#57c77a', '#9b6bff', '#ffb347', '#e05aa0', '#3cc1c8', '#c9a227'];
  function lum(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return 0;
    var n = parseInt(m[1], 16); return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
  }
  // A lighter version of a colour for text on the dark panels (mixes toward white until it reads).
  function readable(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || ''), L = lum(hex);
    if (!m || L >= 0.55) return hex;
    var n = parseInt(m[1], 16), t = (0.55 - L) / (1 - L);
    return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (c) { return ('0' + Math.round(c + (255 - c) * t).toString(16)).slice(-2); }).join('');
  }
  function withText(w) { w.text = readable(w.color); return w; }
  function bandOf(state) { var b = GG.content.bands; return b && state && b[state.bandId] || null; }
  // Resolves a speaker/chat id to { id, name, short, nick, color, text, role } (text: colour readable on dark panels). Works for members, npcs, 'player' and raw names.
  ui.who = function (id, state) {
    state = state || GG.state;
    if (!id) return withText({ id: '', name: '???', short: '???', color: '#6f7a96', role: '' });
    var band = bandOf(state), i, m;
    if (id === 'player' || id === 'you') {
      var p = state && state.player || {};
      var pc = p.look && p.look.shirt;
      return withText({ id: 'player', name: p.name || 'You', short: p.nick || p.name || 'You', color: lum(pc) > 0.12 ? pc : '#ffb347', role: 'Drums (you)' });
    }
    var mems = (state && state.members) || (band && band.members) || [];
    for (i = 0; i < mems.length; i++) if (mems[i].id === id) {
      m = mems[i];
      var cm = band && band.members ? band.members.filter(function (x) { return x.id === id; })[0] : null;
      var shirt = (m.look && m.look.shirt) || (cm && cm.look && cm.look.shirt);
      var color = lum(shirt) > 0.12 ? shirt : PALETTE[i % PALETTE.length];
      var name = m.name || (cm && cm.name) || id;
      return withText({ id: id, name: name, short: String(name).split(' ')[0], nick: m.nick || (cm && cm.nick) || '', color: color,
        full: m.fullName || (cm && cm.fullName) || '', role: m.role || (cm && cm.role) || '' });
    }
    var npc = GG.content.npcs && GG.content.npcs[id];
    if (npc) return withText({ id: id, name: npc.name, short: npc.name, color: npc.color || PALETTE[GG.hashSeed(id) % PALETTE.length], role: npc.role || '' });
    var nice = String(id).replace(/_/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    return withText({ id: id, name: nice, short: nice, color: PALETTE[GG.hashSeed(id) % PALETTE.length], role: '' });
  };
  ui.initials = function (name) {
    var w = String(name || '?').replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).filter(Boolean);
    if (!w.length) return '?';
    return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : w[0].slice(0, 2)).toUpperCase();
  };
  ui.avatar = function (who, size) {
    who = typeof who === 'string' ? ui.who(who) : who;
    return el('div.avatar' + (size ? '.' + size : ''), { style: { background: who.color, color: lum(who.color) > 0.55 ? '#141824' : '#fff' }, title: who.name },
      ui.initials(who.name));
  };

  /* ---- Delta chips -------------------------------------------------------------------------------
     deltas: { fund, fans, buzz, chemistry, burnout, drumSkill, mood: { id: n }, skill: { id: n } } (what actually changed) */
  var STAT_CHIP = [
    ['fund', function (v) { return (v > 0 ? '+' : '') + U.fmtMoney(v); }, 1],
    ['fans', function (v) { return U.signed(v) + ' fans'; }, 1],
    ['buzz', function (v) { return 'Buzz ' + U.signed(v); }, 1],
    ['chemistry', function (v) { return 'Chem ' + U.signed(v); }, 1],
    ['burnout', function (v) { return 'Burnout ' + U.signed(v); }, -1],
    ['drumSkill', function (v) { return 'Your chops ' + U.signed(v); }, 1]
  ];
  ui.deltaChips = function (d, opts) {
    opts = opts || {};
    var chips = [];
    if (d) {
      STAT_CHIP.forEach(function (c) {
        var v = Math.round(d[c[0]] || 0); if (!v) return;
        chips.push(el('span.chip.' + (v * c[2] > 0 ? 'up' : 'down'), c[1](v)));
      });
      ['mood', 'skill'].forEach(function (k) {
        var map = d[k]; if (!map || typeof map !== 'object') return;
        Object.keys(map).forEach(function (id) {
          var v = Math.round(map[id] || 0); if (!v) return;
          var nm = id === 'all' ? 'Everyone' : ui.who(id).short;
          chips.push(el('span.chip.' + (v > 0 ? 'up' : 'down'), nm + (k === 'mood' ? (v > 0 ? ' 🙂 ' : ' 😒 ') : ' skill ') + U.signed(v)));
        });
      });
      if (d.book) chips.push(el('span.chip.up', '📅 Gig booked'));
    }
    if (!chips.length && opts.emptyText !== false) chips.push(el('span.chip', opts.emptyText || 'No change'));
    return el('div.chips', chips);
  };

  /* ---- Init: layers and global listeners ------------------------------------------------------------ */
  ui.init = function () {
    if (ui._inited) return; ui._inited = true;
    var app = document.getElementById('app');
    if (app && !document.getElementById('fx')) app.insertBefore(el('div#fx'), document.getElementById('toast'));
    // Every button tap clicks (sfx) unless it opted out with data-silent.
    document.addEventListener('click', function (e) {
      var b = e.target && e.target.closest && e.target.closest('button');
      if (b && !b.disabled && !b.hasAttribute('data-silent') && GG.audio) GG.audio.sfx('tap');
    }, true);
  };

  // Placeholder so callers can refresh the HUD before 52_ui_week installs the real one.
  ui.refreshHud = ui.refreshHud || function () {};

  GG.registerDebug('ui', function () { return { screen: ui.top(), stack: ui.stackIds() }; });
})(window.GG);

<script>/* 51_ui_menu.js */
// 51_ui_menu.js: everything outside the week loop. Title, load, new-career flow (slot → genre → band intro →
// character creator → cold open), the in-game ☰ menu, and save-code backup/restore.
// Career creation, loading and saving are delegated to GG.main (60_main); this file only builds screens.
(function (GG) {
  var ui = GG.ui, el = ui.el, btn = ui.btn, U = GG.util;
  var draft = {};                  // new-career choices in progress: { slot, bandId }
  var storageWarned = false;

  // Shown when content is missing a band (and for the genre card icons).
  var GENRES = [
    { genre: 'metal', icon: '🤘', label: 'Metal', band: 'Hail Damage', space: "Your parents' garage", city: 'Saskatoon' },
    { genre: 'punk', icon: '🧷', label: 'Punk', band: 'Frost Heave', space: 'A laundromat basement', city: '' },
    { genre: 'rock', icon: '🎸', label: 'Rock', band: 'Gravel Kings', space: 'An empty strip-mall unit', city: '' },
    { genre: 'country', icon: '🤠', label: 'Country', band: 'The Grid Road Ramblers', space: 'A Quonset on a farm', city: '' }
  ];
  var FALLBACK_PRESETS = [
    { id: 'denim_tux', name: 'Denim Tuxedo', blurb: 'Formal. Ish.', kitColor: '#3b6fd8', look: { skin: '#e0b08a', hair: '#4a2f1b', shirt: '#3d5a8a', pants: '#2c4468' } },
    { id: 'toque_flannel', name: 'Toque & Flannel', blurb: 'Dressed for minus forty.', kitColor: '#c0392b', look: { skin: '#c68e62', hair: '#1c1c1c', shirt: '#a3342c', pants: '#2b2b33' } }
  ];

  function bandFor(genre) {
    var bands = GG.content.bands || {};
    for (var k in bands) if (bands[k] && bands[k].genre === genre) return bands[k];
    return null;
  }
  function presets() { return (GG.content.presets && GG.content.presets.length) ? GG.content.presets : FALLBACK_PRESETS; }

  /* ---- Slots ------------------------------------------------------------------------------------ */
  // { auto: { exists, summary, savedAt }, '1': ... } from GG.save.list(), never throws.
  function slotInfo() {
    var out = {};
    GG.contracts.SLOTS.forEach(function (s) { out[s] = { slot: s, exists: false }; });
    try { (GG.save && GG.save.list ? GG.save.list() : []).forEach(function (r) { if (r && out[r.slot]) out[r.slot] = r; }); }
    catch (e) { console.warn('[ui] save.list failed', e); }
    return out;
  }
  function ago(t) {
    if (!t) return '';
    var m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago';
  }
  ui.slotSummary = function (r) {
    if (!r || !r.exists) return 'Empty. Smells like potential.';
    var s = r.summary || {};
    return [s.band || 'A band', 'Y' + (s.year || 1) + ' W' + (s.week || 1), U.fmtNum(s.fans || 0) + ' fans', U.fmtMoney(s.fund || 0)].join(' · ') +
      (r.savedAt ? ' · ' + ago(r.savedAt) : '');
  };
  function slotButton(r, label, testid, onPick, current) {
    return btn('.slot-btn', { testid: testid, disabled: !onPick, onclick: onPick }, [
      el('span.n', label),
      el('span.grow', [el('div.t', r.exists ? ((r.summary && r.summary.player) || 'Your drummer') + (current ? ' (current)' : '') : 'Empty slot'),
        el('div.d', ui.slotSummary(r))])
    ]);
  }

  /* ---- Title -------------------------------------------------------------------------------------- */
  ui.define('title', {
    kind: 'full',
    build: function (s) {
      var info = slotInfo(), auto = info.auto;
      var kids = [];
      if (auto.exists) {
        kids.push(btn('.btn.primary.big.block', { testid: 'btn-continue', onclick: function () { GG.main.load('auto'); } }, 'Continue'));
        kids.push(el('div.small.dim.center', { style: 'margin-top:-4px' }, ui.slotSummary(auto)));
      }
      kids.push(btn('.btn.big.block' + (auto.exists ? '' : '.primary'), { testid: 'btn-new', onclick: function () { ui.show('slots'); } }, 'New career'));
      kids.push(el('div.row', [
        btn('.btn.grow', { testid: 'btn-load', onclick: function () { ui.show('load'); } }, 'Load'),
        btn('.btn.grow', { testid: 'btn-code-restore', onclick: function () { ui.show('code', { mode: 'restore' }); } }, 'Restore code')
      ]));
      kids.push(btn('.btn.ghost.block', { testid: 'title-sound', onclick: function () { GG.audio.toggleMuted(); s.rerender(); } }, soundLabel()));
      ui.append(s.body, [
        el('div.title-glow'), el('div.title-bg'),
        el('div.title-wrap', [
          el('h1.logo', ['Garage', el('span.to', 'to'), el('span.glory', 'Glory')]),
          el('p.tagline', "From your parents' garage to the Loonie Awards. Probably."),
          el('div.menu-list', kids),
          el('p.credit', { testid: 'title-credit' }, 'a game by Prairie Blue Studio · V' + GG.VERSION)
        ])
      ]);
      if (GG.save && GG.save.storageOk === false && !storageWarned) {
        storageWarned = true;
        ui.toast("This browser won't keep saves after you close the tab. Back up with a save code (☰ → Back up).", { kind: 'bad', ms: 7000 });
      }
    }
  });
  function soundLabel() { return GG.audio && GG.audio.isMuted() ? '🔇 Sound: off' : '🔊 Sound: on'; }

  /* ---- Load --------------------------------------------------------------------------------------- */
  ui.define('load', {
    kind: 'sheet', title: 'Load a career',
    build: function (s) {
      var info = slotInfo();
      var list = el('div.menu-list');
      GG.contracts.SLOTS.forEach(function (slot) {
        var r = info[slot];
        list.appendChild(slotButton(r, slot === 'auto' ? '⟳' : slot, 'load-' + slot,
          r.exists ? function () { ui.close(s.id); GG.main.load(slot); } : null));
      });
      ui.append(s.body, [el('p.small.dim', { style: 'margin-bottom:10px' }, '⟳ is the autosave: it updates at the end of every week.'), list]);
    }
  });

  /* ---- New career: slot pick ------------------------------------------------------------------------- */
  ui.define('slots', {
    kind: 'sheet', title: 'Pick a save slot',
    build: function (s) {
      var info = slotInfo(), list = el('div.menu-list');
      ['1', '2', '3'].forEach(function (slot) {
        var r = info[slot];
        list.appendChild(slotButton(r, slot, 'slot-' + slot, function () {
          function go() { draft = { slot: slot }; ui.close(s.id); ui.show('genre'); }
          if (!r.exists) return go();
          ui.confirm({ title: 'Overwrite slot ' + slot + '?', text: ui.slotSummary(r) + '. That band will be gone for good (they had it coming).',
            yes: 'Overwrite', no: 'Keep it', danger: true }).then(function (ok) { if (ok) go(); });
        }));
      });
      ui.append(s.body, [el('p.small.dim', { style: 'margin-bottom:10px' }, 'Your career autosaves here at the end of every week.'), list]);
    }
  });

  function backRow(s, heading, sub) {
    return el('div', [
      el('div.back-row', [btn('.icon-btn', { testid: 'btn-back', 'aria-label': 'Back', onclick: function () { ui.close(s.id); } }, '←'),
        sub ? el('span.caps', sub) : null]),
      el('h1.screen-h', heading)
    ]);
  }

  /* ---- New career: genre ------------------------------------------------------------------------------ */
  ui.define('genre', {
    kind: 'full',
    build: function (s) {
      var list = el('div.stack', { style: 'margin-top:18px' });
      GENRES.forEach(function (g) {
        var band = bandFor(g.genre);
        var locked = band ? !!band.locked : g.genre !== 'metal';
        var name = band ? band.name : g.band;
        var where = band ? (band.spaceName || g.space) + (band.city ? ', ' + band.city : '') : g.space + (g.city ? ', ' + g.city : '');
        list.appendChild(btn('.genre-card' + (locked ? '' : '.live'), {
          testid: 'genre-' + g.genre, disabled: locked,
          onclick: function () { draft.bandId = band ? band.id : 'hail_damage'; draft.genre = g.genre; ui.show('intro'); }
        }, [
          el('span.ico', g.icon),
          el('span.grow', [el('div.g', g.label), el('div.b', name), el('div.c', where)]),
          locked ? el('span.tag', 'Coming in ' + ((band && band.comingIn) || 'v0.9')) : el('span.tag.amber', 'Playable')
        ]));
      });
      ui.append(s.body, [backRow(s, 'Pick your poison', 'New career · slot ' + (draft.slot || '1')),
        el('p.screen-sub', "You're the drummer. You're always the drummer."), list]);
    }
  });

  /* ---- New career: band intro --------------------------------------------------------------------------- */
  ui.define('intro', {
    kind: 'full',
    build: function (s) {
      var band = (GG.content.bands || {})[draft.bandId] || bandFor(draft.genre || 'metal');
      var g = GENRES.filter(function (x) { return x.genre === (draft.genre || 'metal'); })[0];
      var name = band ? band.name : g.band;
      var home = (band && band.spaceName) || g.space;
      var city = (band && band.city) || g.city;
      var mates = el('div');
      ((band && band.members) || []).forEach(function (m) {
        var who = ui.who(m.id, { bandId: band.id, members: band.members });
        mates.appendChild(el('div.member-row', [ui.avatar(who), el('div.grow', [
          el('div.nm', m.fullName || m.name + (m.nick ? ' "' + m.nick + '"' : '')),
          el('div.rl', m.role || ''),
          m.bio ? el('div.bio', m.bio) : null
        ])]));
      });
      ui.append(s.body, [
        backRow(s, name, g.label + (city ? ' · ' + city : '')),
        el('div.stack', { style: 'margin-top:16px' }, [
          band && band.blurb ? el('p', { style: 'font-size:16px' }, band.blurb) : null,
          el('div.panel.warm.row', [el('span', { style: 'font-size:28px' }, '🏠'), el('div.grow', [el('div.caps', 'Home base'),
            el('div', { style: 'font-weight:800' }, home.charAt(0).toUpperCase() + home.slice(1) + (city ? ', ' + city : ''))])]),
          mates.children.length ? el('div.panel', [el('div.caps', { style: 'margin-bottom:4px' }, 'The band (plus you, on drums)'), mates]) : null
        ])
      ]);
      s.foot.appendChild(btn('.btn.primary.big.block', { testid: 'btn-intro-next', onclick: function () { ui.show('creator'); } }, "That's my band →"));
    }
  });

  /* ---- New career: character creator -------------------------------------------------------------------- */
  function figure(p) {
    var L = p.look || {};
    var bald = L.hairStyle === 'bald';
    return el('div.fig', [
      el('div.lg', { style: { background: L.pants || '#333' } }),
      el('div.bd', { style: { background: L.shirt || '#555' } }),
      el('div.hd', { style: { background: L.skin || '#d9a57b' } }),
      bald ? null : el('div.hr', { style: { background: L.hair || '#222', height: L.hairStyle === 'long' || L.hairStyle === 'mullet' ? '20px' : '11px' } }),
      (L.extras || []).indexOf('sunglasses') >= 0 ? el('div.sh') : null,
      el('div.kit', { style: { background: p.kitColor || '#c33' }, title: 'Kit colour' })
    ]);
  }
  ui.define('creator', {
    kind: 'full',
    build: function (s) {
      var list = presets();
      if (!draft.presetId || !list.some(function (p) { return p.id === draft.presetId; })) draft.presetId = list[0].id;
      var err = el('div.err');
      var create;
      var name = el('input', { testid: 'creator-name', id: 'cr-name', type: 'text', maxLength: 16, placeholder: 'e.g. Tanner', autocomplete: 'off', value: draft.name || '',
        oninput: function () { draft.name = name.value; create.disabled = !name.value.trim(); err.textContent = ''; } });
      var nick = el('input', { testid: 'creator-nick', id: 'cr-nick', type: 'text', maxLength: 16, placeholder: 'e.g. Thunderwrist (optional)', autocomplete: 'off', value: draft.nick || '',
        oninput: function () { draft.nick = nick.value; } });
      var grid = el('div.presets');
      list.forEach(function (p) {
        grid.appendChild(btn('.preset' + (p.id === draft.presetId ? '.on' : ''), { testid: 'preset-' + p.id, 'aria-pressed': p.id === draft.presetId ? 'true' : 'false',
          onclick: function () { draft.presetId = p.id; s.rerender(); } }, [figure(p), el('div.pn', p.name), el('div.pb', p.blurb || '')]));
      });
      create = btn('.btn.primary.big.block', { testid: 'btn-create', disabled: !(draft.name || '').trim(), onclick: function () {
        var n = (name.value || '').trim().slice(0, 16);
        if (!n) { err.textContent = 'Even drummers need a name.'; return; }
        create.disabled = true;
        GG.main.newCareer({ slot: draft.slot || '1', bandId: draft.bandId || 'hail_damage',
          player: { name: n, nick: (nick.value || '').trim().slice(0, 16), presetId: draft.presetId },
          seed: GG.hashSeed(n + Date.now()) });
        ui.closeAll();
        ui.show('coldopen');
      } }, 'Start the band');
      ui.append(s.body, [
        backRow(s, "Who's on drums?", 'Character'),
        el('p.screen-sub', "You. You're on drums. You founded the band, you can't quit, and nobody can fire you."),
        el('div.stack', { style: 'margin-top:16px' }, [
          el('div.field', [el('label', { htmlFor: 'cr-name' }, 'Your name'), name, err]),
          el('div.field', [el('label', { htmlFor: 'cr-nick' }, 'Stage nickname'), nick]),
          el('div.caps', 'Pick a look'),
          grid
        ])
      ]);
      s.foot.appendChild(create);
    }
  });

  /* ---- New career: cold open ------------------------------------------------------------------------------ */
  var COLD_FALLBACK = [
    'Saskatoon. A Tuesday in July. The sky turns the colour of a bruise.',
    "Hail the size of golf balls totals your dad's truck in about four minutes.",
    'The insurance adjuster writes two words on the claim form: HAIL DAMAGE.',
    "That night, in your parents' garage, you start a band. You already have a name."
  ];
  ui.define('coldopen', {
    kind: 'full',
    build: function (s, d) {
      var band = GG.state && (GG.content.bands || {})[GG.state.bandId];
      var panels = (band && band.coldOpen && band.coldOpen.length) ? band.coldOpen : COLD_FALLBACK;
      var i = U.clamp(d.i || 0, 0, panels.length - 1), last = i === panels.length - 1;
      function finish() { ui.close(s.id); GG.main.enterGarage(); }
      function next() { if (last) return finish(); if (GG.audio) GG.audio.sfx('whoosh'); s.rerender({ i: i + 1 }); }
      var dots = el('div.dots', panels.map(function (_, k) { return el('i' + (k === i ? '.on' : '')); }));
      s.body.appendChild(el('div.cold', { onclick: next }, [
        el('div.hail'),
        el('div.cold-top', [el('span.caps', (band ? band.name : 'Hail Damage') + ' · ' + (i + 1) + '/' + panels.length),
          btn('.btn.ghost.small', { testid: 'btn-coldopen-skip', onclick: function (e) { e.stopPropagation(); finish(); } }, 'Skip')]),
        el('div.cold-text', GG.career && GG.state ? GG.career.fillText(GG.state, panels[i]) : panels[i]),
        el('div.cold-foot', [dots, btn('.btn.primary.big.block', { testid: 'btn-coldopen-next' }, last ? 'Into the garage →' : 'Next')])
      ]));
    }
  });

  /* ---- In-game menu ------------------------------------------------------------------------------------------ */
  ui.define('menu', {
    kind: 'sheet', title: 'Menu',
    build: function (s) {
      var st = GG.state, info = slotInfo();
      var saves = el('div.menu-list');
      ['1', '2', '3'].forEach(function (slot) {
        var r = info[slot], mine = st && st.slot === slot;
        saves.appendChild(slotButton(r, slot, 'menu-save-' + slot, function () {
          function go() { if (GG.main.saveTo(slot)) s.rerender(); }
          if (!r.exists || mine) return go();
          ui.confirm({ title: 'Overwrite slot ' + slot + '?', text: ui.slotSummary(r) + '.', yes: 'Overwrite', no: 'Cancel', danger: true })
            .then(function (ok) { if (ok) go(); });
        }, mine));
      });
      ui.append(s.body, [el('div.stack', [
        btn('.btn.primary.block', { testid: 'menu-resume', onclick: function () { ui.close(s.id); } }, 'Resume'),
        el('div.caps', 'Save to a slot'),
        saves,
        el('div.caps', 'Save code'),
        el('div.row', [
          btn('.btn.grow', { testid: 'menu-code', onclick: function () { ui.show('code', { mode: 'backup' }); } }, 'Back up'),
          btn('.btn.grow', { testid: 'menu-restore', onclick: function () { ui.show('code', { mode: 'restore' }); } }, 'Restore')
        ]),
        el('div.sep'),
        el('div.row', [
          btn('.btn.grow', { testid: 'menu-sound', onclick: function () { GG.audio.toggleMuted(); s.rerender(); } }, soundLabel()),
          btn('.btn.danger.grow', { testid: 'menu-quit', onclick: function () {
            ui.confirm({ title: 'Quit to title?', text: 'Anything since the last autosave (end of last week) or manual save is lost.', yes: 'Quit', no: 'Stay', danger: true })
              .then(function (ok) { if (ok) GG.main.quitToTitle(); });
          } }, 'Quit to title')
        ])
      ])]);
    }
  });

  /* ---- Save code: backup + restore ------------------------------------------------------------------------------ */
  ui.define('code', {
    kind: 'sheet',
    title: function (d) { return d.mode === 'backup' ? 'Back up' : 'Restore'; },
    build: function (s, d) {
      var backup = d.mode === 'backup';
      var code = '';
      if (backup) {
        try { code = GG.save.toCode(GG.state); } catch (e) { code = ''; console.warn('[ui] toCode failed', e); }
      }
      var ta = el('textarea.code', { testid: 'code-text', rows: 6, spellcheck: 'false', autocomplete: 'off', readOnly: backup, value: code,
        placeholder: 'Paste a GG1:… code here' });
      var msg = el('div.err', { testid: 'code-error', role: 'alert' });
      ui.append(s.body, [el('div.stack', [
        el('p.small.dim', backup ? 'Your whole career as one alarming string. Paste it into your notes app or email it to yourself. It works on any device.'
          : 'Paste a save code. Line breaks and stray spaces are fine; missing chunks are not.'),
        ta, el('div.field', [msg])
      ])]);
      if (backup) {
        s.foot.appendChild(btn('.btn.primary.big.block', { testid: 'btn-code-copy', onclick: function () {
          function fallback() {
            ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
            var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
            ui.toast(ok ? 'Copied. Guard it with your life (or at least your notes app).' : 'Code selected. Long-press it and tap Copy.');
          }
          if (!code) return ui.toast("Couldn't make a save code. That's… not great.", { kind: 'bad' });
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(code).then(function () { ui.toast('Copied. Guard it with your life (or at least your notes app).', { kind: 'good' }); }, fallback);
          } else fallback();
        } }, 'Copy code'));
      } else {
        s.foot.appendChild(btn('.btn.primary.big.block', { testid: 'btn-code-load', onclick: function () {
          var state;
          msg.textContent = '';
          try { state = GG.save.fromCode(ta.value); }
          catch (e) { msg.textContent = (e && e.message) || "That code didn't work."; return; }
          if (!state) { msg.textContent = "That code didn't work."; return; }
          var go = function () { ui.closeAll(); GG.main.loadState(state, { from: 'code' }); };
          if (!GG.state) return go();
          ui.confirm({ title: 'Swap careers?', text: 'This replaces the career you have open. Unsaved progress is lost.', yes: 'Load it', no: 'Cancel', danger: true })
            .then(function (ok) { if (ok) go(); });
        } }, 'Load career'));
      }
    }
  });
})(window.GG);

</script>
<script>/* 52_ui_week.js */
// 52_ui_week.js: the weekly loop in the garage. HUD top bar + contextual primary button (the dock), Monday card,
// whiteboard planner, week results, week wrap, end screen, hotspot/bandmate taps, placeholder sheets for later
// versions, and the 2D fallback garage when three.js/WebGL isn't available.
// Flow commands (start/run/end the week, save) go through GG.main; this file only reads GG.state and calls
// GG.career for the per-screen actions (resolve a card, edit the plan, accept an offer).
(function (GG) {
  var ui = GG.ui, el = ui.el, btn = ui.btn, U = GG.util, C = GG.contracts;
  var hud = null, dock = null, fallback = null;

  function S() { return GG.state; }
  function fill(text) { return text && GG.career && GG.career.fillText && S() ? GG.career.fillText(S(), text) : (text || ''); }
  function lines(key) { return (GG.content.lines && GG.content.lines[key]) || null; }
  function sfx(n) { if (GG.audio) GG.audio.sfx(n); }

  var ACT_FALLBACK = {
    rehearse: { icon: '🥁', name: 'Rehearse', blurb: 'Tighter band, sorer wrists.' },
    write: { icon: '✍️', name: 'Write', blurb: 'A new song. Probably about a lawn.' },
    promote: { icon: '📣', name: 'Promote', blurb: "Posters, posts and your mom's Facebook." },
    book: { icon: '📅', name: 'Book', blurb: 'Find somewhere that will have you.' },
    hustle: { icon: '💵', name: 'Hustle', blurb: 'Weddings, busking, bingo. Cash.' },
    rest: { icon: '🛋️', name: 'Rest', blurb: 'Burnout down, moods up. The couch wins.' }
  };
  ui.act = function (id) {
    var a = (GG.content.activities && GG.content.activities[id]) || {};
    var f = ACT_FALLBACK[id] || { icon: '❔', name: id, blurb: '' };
    return { id: id, icon: a.icon || f.icon, name: a.name || f.name, blurb: a.blurb || f.blurb };
  };

  /* ======================================================================================================
     HUD top bar + dock
     ====================================================================================================== */
  var STAT_HELP = {
    week: 'The calendar. 24 weeks a year, ten years to glory. Every week: a Monday card, three blocks, maybe a gig.',
    fund: 'Band fund: the one shared wallet. Gigs and Hustle fill it; upkeep, gas and capes drain it. Hit zero and your parents "help".',
    fans: 'Fans: people who would admit to liking you. Gigs and buzz grow them, and they never leave. Your mom counts.',
    buzz: 'Buzz: how hard people are talking about you right now. Promote and play gigs to pump it; it fades every week.',
    chem: 'Chemistry: how well the band gels. Rehearsing and good gigs help; drama, burnout and grumpy members hurt.'
  };
  function hudChip(key, testid, label) {
    var v = el('span.v'), l = el('span.l', label), extra = key === 'buzz' || key === 'chem' ? ui.bar(0, 100) : null;
    var b = btn('.hud-chip.' + key, { testid: testid, onclick: function () { ui.toast(STAT_HELP[key]); } }, [l, v, extra]);
    b._v = v; b._l = l; b._bar = extra;
    return b;
  }
  function buildHud() {
    var root = document.getElementById('hud');
    if (!root || hud) return;
    hud = {
      week: hudChip('week', 'hud-week', 'Y1'), fund: hudChip('fund', 'hud-fund', 'Fund'), fans: hudChip('fans', 'hud-fans', 'Fans'),
      buzz: hudChip('buzz', 'hud-buzz', 'Buzz'), chem: hudChip('chem', 'hud-chem', 'Chem')
    };
    hud.bar = el('div.hud-bar', [hud.week, hud.fund, hud.fans, hud.buzz, hud.chem,
      btn('.hud-menu', { testid: 'btn-menu', 'aria-label': 'Menu', onclick: function () { ui.show('menu'); } }, '☰')]);
    dock = { hint: el('div.hint') };
    dock.btn = btn('.btn.primary.big.block', { testid: 'btn-primary', onclick: primaryAction }, 'Plan the week');
    dock.root = el('div.dock', [dock.hint, dock.btn]);
    ui.append(root, [hud.bar, dock.root]);
  }
  function setBar(barEl, v) { if (barEl) barEl.firstChild.style.width = U.clamp(v, 0, 100) + '%'; }

  var PRIMARY = {
    monday: 'Monday card', plan: 'Plan the week', week: 'Wrap up the week', wrap: 'Wrap up the week', ended: 'Career over'
  };
  function primaryAction() {
    var st = S(); if (!st) return;
    if (st.phase === 'monday') { if (st.card && !st.card.resolved) ui.show('card'); else GG.main.beginWeek(); }
    else if (st.phase === 'plan') ui.openPlanner();
    else if (st.phase === 'wrap' || st.phase === 'week') GG.main.wrapWeek();
    else if (st.phase === 'ended') ui.show('end');
  }
  function dockHint(st) {
    if (st.phase === 'plan' && st.totalWeek <= 2) return GG.main.renderOk ? 'Tap the floor to walk. Tap stuff to use it.' : 'Tap a spot in the garage to use it.';
    if (st.phase === 'monday') return 'New week. Somebody has news.';
    return '';
  }

  ui.refreshHud = function () {
    if (!hud) return;
    var st = S(), stack = ui.stackIds();
    var hudOn = !!st && !ui.hasFull();
    hud.bar.classList.toggle('hidden', !hudOn);
    document.getElementById('app').classList.toggle('hud-on', hudOn);
    dock.root.classList.toggle('hidden', !st || stack.length > 0);
    if (!st) return;
    hud.week._l.textContent = 'Y' + st.year;
    hud.week._v.textContent = 'W' + st.week + '/' + C.WEEKS_PER_YEAR;
    hud.fund._v.textContent = U.fmtMoney(st.fund);
    hud.fund.classList.toggle('neg', st.fund < 0);
    hud.fans._v.textContent = U.fmtNum(st.fans);
    hud.buzz._v.textContent = String(Math.round(st.buzz));
    hud.chem._v.textContent = String(Math.round(st.chemistry));
    setBar(hud.buzz._bar, st.buzz); setBar(hud.chem._bar, st.chemistry);
    dock.btn.textContent = PRIMARY[st.phase] || 'Continue';
    var h = dockHint(st);
    dock.hint.textContent = h; dock.hint.classList.toggle('hidden', !h);
  };

  /* ======================================================================================================
     Monday card
     ====================================================================================================== */
  var lastSuccess = null;   // resolveCard's success flag, for the outcome view
  function cardHead(card) {
    var who = ui.who(card.speaker);
    return el('div.card-head', [ui.avatar(who, 'lg'), el('div.grow', [el('div.who', who.name), el('div.role', who.role || who.nick || '')]),
      card.type ? el('span.tag', card.type) : null]);
  }
  function choiceHint(st, ch) {
    if (GG.career.choiceHint) return GG.career.choiceHint(st, ch);
    return ch.hint ? fill(ch.hint) : GG.career.effectSummary(ch.effects, st);
  }
  ui.define('card', {
    kind: 'sheet',
    build: function (s) {
      var st = S(); if (!st) return;
      s.setTitle('Monday', 'YEAR ' + st.year + ' · WEEK ' + st.week);
      var card = GG.career.currentCard(st);
      var res = st.card && st.card.resolved ? st.card : null;
      if (!card) {
        s.body.appendChild(el('p.dim', 'No card this week. Suspiciously quiet.'));
        s.foot.appendChild(btn('.btn.primary.big.block', { testid: 'btn-card-ok', onclick: function () { ui.close(s.id); } }, 'OK'));
        return;
      }
      ui.append(s.body, [cardHead(card), el('h3.card-title', fill(card.title)), el('p.card-text', fill(card.text))]);
      if (!res) {
        (card.choices || []).forEach(function (ch, i) {
          s.body.appendChild(btn('.choice', { testid: 'choice-' + i, onclick: function () {
            var cur = S();
            if (!cur || cur.phase !== 'monday' || !cur.card || cur.card.resolved) return;   // double-tap guard
            var r = GG.career.resolveCard(cur, i);
            lastSuccess = r ? r.success : null;
            if (r && r.deltas && (r.deltas.fund || 0) > 0) sfx('cash');
            GG.main.sync();
            s.rerender();
          } }, [el('span.cl', fill(ch.label)), el('span.ch', choiceHint(st, ch) || 'Who knows?')]));
        });
        return;
      }
      var chosen = card.choices && card.choices[res.choice];
      ui.append(s.body, [
        chosen ? el('div.you', ['You picked: ', el('b', fill(chosen.label))]) : null,
        lastSuccess === true ? el('span.tag.amber', { style: 'margin-bottom:8px' }, 'It worked!') : lastSuccess === false ? el('span.tag', { style: 'margin-bottom:8px;color:var(--bad)' }, 'Welp.') : null,
        el('div.quote', fill(res.outcome || '')),
        el('div', { style: 'margin-top:12px' }, ui.deltaChips(res.deltas, { emptyText: 'Nothing changed. Somehow.' }))
      ]);
      s.foot.appendChild(btn('.btn.primary.big.block', { testid: 'btn-card-ok', onclick: function () { ui.close(s.id); } }, 'OK'));
    },
    onShow: function () { sfx('card'); },
    onClose: function () { lastSuccess = null; var st = S(); if (st && st.phase === 'plan') GG.main.afterCard(); }
  });

  /* ======================================================================================================
     Gig info (planner + gig board)
     ====================================================================================================== */
  function dealText(g) {
    if (g.deal === 'exposure') return 'Pays in "exposure"';
    if (g.deal === 'door') return 'Door deal' + (g.pay ? ' (' + U.fmtMoney(g.pay) + ' a head)' : '');
    return 'Flat ' + U.fmtMoney(g.pay || 0);
  }
  function gigBox(st, withButtons, after) {
    if (st.gig) {
      var g = st.gig;
      return el('div.panel.warm.gig-box', [el('span.ico', '🎤'), el('div.grow', [
        el('div.caps', 'Booked this weekend'),
        el('div.vn', g.name),
        el('div.small.dim', [g.city, dealText(g), g.capacity ? 'cap. ' + g.capacity : '', g.gas ? 'gas ' + U.fmtMoney(g.gas) : ''].filter(Boolean).join(' · ')),
        g.quirk ? el('div.q', fill(g.quirk)) : null
      ])]);
    }
    if (st.offer) {
      var o = st.offer;
      var can = withButtons && st.phase === 'plan';
      return el('div.panel.warm', [el('div.gig-box', [el('span.ico', '📨'), el('div.grow', [
        el('div.caps', 'Gig offer for this weekend'),
        el('div.vn', o.name),
        el('div.small.dim', [o.city, dealText(o), o.capacity ? 'cap. ' + o.capacity : ''].filter(Boolean).join(' · ')),
        o.quirk ? el('div.q', fill(o.quirk)) : null
      ])]), can ? el('div.row', { style: 'margin-top:10px' }, [
        btn('.btn.small.grow', { testid: 'offer-decline', onclick: function () { if (S().offer) { GG.career.declineOffer(S()); GG.main.sync(); after(); } } }, 'Decline'),
        btn('.btn.primary.small.grow', { testid: 'offer-accept', onclick: function () { if (S().offer) { GG.career.acceptOffer(S()); GG.main.sync(); after(); } } }, 'Accept')
      ]) : null]);
    }
    return el('div.panel.gig-box', [el('span.ico', '🗓️'), el('div.grow', [el('div.caps', 'This weekend'),
      el('div', { style: 'font-weight:700' }, 'No gig booked.'), el('div.small.dim', 'Put Book in a slot and someone might have you.')])]);
  }

  /* ======================================================================================================
     Planner (the whiteboard)
     ====================================================================================================== */
  var plan = [null, null, null], sel = 0;
  ui.openPlanner = function () {
    var st = S(); if (!st) return;

<script>/* 53_ui_laptop.js */

  }
  function bandTab(st) {

    (st.members || []).forEach(function (m) {
      var who = ui.who(m.id), label = ui.moodLabel(m.mood);
      out.push(el('div.mem-card', [
        el('div.row', [ui.avatar(who), el('div.grow', [el('div', { style: 'font-weight:800' }, who.full || who.name + (who.nick ? ' "' + who.nick + '"' : '')),
          el('div.small.dim', who.role || '')]), m.status && m.status !== 'active' ? el('span.tag', m.status) : null]),
        statRow('Skill', m.skill, 'var(--blue)'),
        statRow('Mood', m.mood, ui.moodColor(m.mood), ui.moodEmoji(label))
      ]));
    });
    var p = st.player || {};
    out.push(el('div.mem-card', [
      el('div.row', [ui.avatar(ui.who('player')), el('div.grow', [el('div', { style: 'font-weight:800' }, (p.name || 'You') + (p.nick ? ' "' + p.nick + '"' : '')),
        el('div.small.dim', 'Drums · founder · unfireable')])]),
      statRow('Chops', st.drumSkill, 'var(--amber)')
    ]));
    var songs = st.songs || [];
    var list = el('div.panel', { testid: 'laptop-songs' }, songs.length ? songs.map(function (s) {
      return el('div.song', [el('span', { style: 'font-size:20px' }, '🎵'), el('div.grow', [el('div.fr', s.title), s.titleEn ? el('div.en', s.titleEn) : null]),
        el('div.small.dim', { style: 'text-align:right;white-space:nowrap' }, ['Q ' + Math.round(s.quality || 0), el('br'), 'Polish ' + Math.round(s.polish || 0) + ' · ▶' + (s.plays || 0)])]);
    }) : el('p.dim', 'No songs yet. Marcel is "workshopping".'));
    out.push(el('div.caps', { style: 'margin:14px 0 6px' }, 'Song catalog (' + songs.length + ')'), list);
    return el('div', out);
  }

  function moneyTab(st) {
    var hist = (st.history || []).slice(-12);
    var max = Math.max.apply(null, [1].concat(hist.map(function (h) { return Math.abs(h.fund || 0); })));
    var bars = el('div.hist', hist.length ? hist.map(function (h) {
      var wk = ((h.w - 1) % GG.contracts.WEEKS_PER_YEAR) + 1;
      return el('div', [el('span', 'W' + wk), ui.bar(Math.max(0, h.fund), max, { color: h.fund > 0 ? 'var(--good)' : 'var(--bad)' }), el('b', U.fmtMoney(h.fund))]);
    }) : el('p.dim.small', 'No history yet. Check back after a week.'));
    var s = st.stats || {};
    return el('div.stack', [
      el('div.panel', [el('div.caps', 'Band fund'), el('div.big-num' + (st.fund < 0 ? '.bad' : ''), { testid: 'laptop-fund' }, U.fmtMoney(st.fund))]),
      el('div.line-list.panel', [
        el('div', [el('span', 'Owed to your parents'), el('span' + (st.debtToParents ? '.bad' : ''), U.fmtMoney(st.debtToParents || 0))]),
        el('div', [el('span', "Parents' loans so far"), el('span', String(s.parentsLoans || 0))]),
        s.earned != null ? el('div', [el('span', 'Earned, all time'), el('span', U.fmtMoney(s.earned))]) : null,
        el('div', [el('span', 'Gigs played'), el('span', String(s.gigs || 0))])
      ]),
      el('div.panel', [el('div.caps', { style: 'margin-bottom:8px' }, 'Fund, last ' + hist.length + ' weeks'), bars]),
      st.debtToParents ? el('p.small.dim.center', 'Your mom has started leaving night-school brochures on the drum throne.') : null
    ]);
  }

  ui.define('laptop', {
    kind: 'sheet', tall: true, title: 'The laptop',
    build: function (s, d) {
      var st = GG.state; if (!st) return;
      var tab = d.tab || lastTab;
      lastTab = tab;
      s.setTitle('The laptop', 'CRACKED SCREEN · 12% BATTERY');
      var body = tab === 'band' ? bandTab(st) : tab === 'money' ? moneyTab(st) : chatTab(st);
      ui.append(s.body, [el('div', { style: 'position:sticky;top:0;z-index:2;padding:2px 0 10px;background:var(--panel)' },
        ui.tabs(TABS, tab, function (id) { s.rerender({ tab: id }); s.body.scrollTop = 0; if (id === 'chat') toBottom(s); }, 'laptop-tab-')), body]);
      if (tab === 'chat') toBottom(s);
    }
  });
  function toBottom(s) { setTimeout(function () { s.body.scrollTop = s.body.scrollHeight; }, 0); }
})(window.GG);

</script>
<script>/* 60_main.js */
// 60_main.js: boot, the live career (GG.state), routing by phase, the week flow, autosave, and the glue to
// render + audio. Screens call these; sims never do.
//   GG.main.newCareer({ slot, bandId, player, seed }) ; quickStart({ seed, slot, name, openCard }) ; load(slot)
//   loadState(state, { slot }) ; enterGarage() ; route() ; beginWeek() ; afterCard() ; wrapWeek() ; nextWeek()
//   saveTo(slot) ; quitToTitle() ; sync()
// URL: ?quick=1&seed=N skips the menus (tests/dev).
(function (GG) {
  var M = GG.main = GG.main || {};
  var ui = GG.ui;
  M.booted = false; M.renderOk = false; M.lastSave = null;
  GG.state = GG.state || null;

  // Calls GG.render[fn] if it exists. Render bugs are logged as errors (tests catch them) but never stop the UI.
  function render(fn) {
    var R = GG.render;
    if (!M.renderOk || !R || typeof R[fn] !== 'function') return undefined;
    try { return R[fn].apply(R, Array.prototype.slice.call(arguments, 1)); }
    catch (e) { console.error('[main] render.' + fn + ' failed', e); return undefined; }
  }
  function fill(t) { return t && GG.state && GG.career.fillText ? GG.career.fillText(GG.state, t) : t; }
  function sfx(n) { if (GG.audio) GG.audio.sfx(n); }

  // Pause the 3D loop while a full screen hides it, while the tab is hidden, or when no career is loaded.
  function updatePause() { render('setPaused', !!(document.hidden || ui.hasFull() || !GG.state)); }
  GG.on('screen:open', updatePause);
  GG.on('screen:close', updatePause);

  // Keep the garage framed in the band between the HUD and the topmost bottom sheet (render glides there).
  // Very tall sheets would squash the room, so the band never gets smaller than MIN_BAND px.
  var MIN_BAND = 150, insetRaf = 0, lastInsets = '';
  function updateInsets() {
    if (!M.renderOk || insetRaf) return;
    insetRaf = requestAnimationFrame(function () {
      insetRaf = 0;
      var H = window.innerHeight || 844, bar = document.querySelector('#hud .hud-bar');
      var top = bar && !bar.classList.contains('hidden') ? Math.round(bar.getBoundingClientRect().bottom) : 0;
      var sheets = document.querySelectorAll('#screens .sheet-layer:not(.hidden) .sheet'), sheet = sheets[sheets.length - 1];
      var ins = { top: top, bottom: sheet ? Math.min(sheet.offsetHeight, H - top - MIN_BAND) : -1 }, key = ins.top + ',' + ins.bottom;
      if (key !== lastInsets) { lastInsets = key; render('setViewInsets', ins); }
    });
  }
  GG.on('ui:stack', updateInsets);
  GG.on('ui:layout', updateInsets);

  // After any state change: 3D garage, HUD, dock.
  M.sync = function () {
    if (GG.state) render('syncState', GG.state);
    if (ui.refreshGarage) ui.refreshGarage();
  };
  function setState(st) {
    GG.state = st;
    render('setScene', st ? 'garage' : 'none');
    M.sync();
    updatePause();
  }

  /* ---- Saving ------------------------------------------------------------------------------------ */
  function write(slot, st) {
    try { return !!GG.save.write(String(slot), st); } catch (e) { console.warn('[main] save.write failed', e); return false; }
  }
  function autosave(st) {
    var ok = write('auto', st);
    if (st.slot && st.slot !== 'auto') ok = write(st.slot, st) && ok;
    M.lastSave = { ok: ok, at: Date.now(), totalWeek: st.totalWeek };
    if (!ok && GG.save.storageOk !== false) {
      ui.toast("Autosave failed. Back up with a save code (☰ → Back up) so you don't lose this.", { kind: 'bad', ms: 6000 });
      GG.emit('save:failed', { slot: 'auto', error: 'write failed' });
    }
    return ok;
  }
  // endWeek emits 'week:wrap' once the week has advanced; if a sim ever emits it mid-wrap, save right after.
  GG.on('week:wrap', function () {
    var st = GG.state; if (!st) return;
    if (st.phase === 'wrap') Promise.resolve().then(function () { if (GG.state === st) autosave(st); });
    else autosave(st);
  });
  // Manual save from the menu. The slot becomes this career's slot; 'auto' is refreshed so Continue lands here.
  M.saveTo = function (slot) {
    var st = GG.state; if (!st) return false;
    st.slot = String(slot);
    var ok = write(slot, st) && write('auto', st);
    if (ok) { sfx('save'); ui.toast('Saved to slot ' + slot + '.', { kind: 'good' }); }
    else if (GG.save.storageOk === false) ui.toast('Saved for this tab only: this browser blocks storage. Back up with a save code.', { kind: 'bad' });
    else ui.toast('Save failed. Try backing up with a save code.', { kind: 'bad' });
    return ok || GG.save.storageOk === false;
  };

  /* ---- Careers ------------------------------------------------------------------------------------- */
  M.newCareer = function (o) {
    o = o || {};
    var st = GG.career.newCareer({ seed: o.seed, bandId: o.bandId || 'hail_damage', slot: String(o.slot || '1'), player: o.player || { name: 'You' } });
    setState(st);
    write(st.slot, st); write('auto', st);   // the slot is claimed right away, so Continue works from week 1
    return st;
  };
  // Dev/tests: a career with defaults, landing in the garage at week 1 (Monday card open unless openCard:false).
  M.quickStart = function (o) {
    o = o || {};
    var name = o.name || 'Tester';
    var presets = GG.content.presets || [];
    ui.closeAll();
    M.newCareer({ seed: o.seed != null ? (o.seed >>> 0) || 1 : GG.hashSeed(name + Date.now()), slot: o.slot || '1', bandId: o.bandId,
      player: { name: name, nick: o.nick || '', presetId: o.presetId || (presets[0] && presets[0].id) } });
    if (o.openCard === false) { GG.career.startWeek(GG.state); M.sync(); }
    else M.enterGarage();
    return GG.state;
  };
  M.load = function (slot) {
    var st = null;
    try { st = GG.save.read(String(slot)); } catch (e) { console.warn('[main] save.read failed', e); }
    if (!st) { ui.toast("That save wouldn't load. The garage ate it.", { kind: 'bad' }); return false; }
    M.loadState(st, { slot: slot });
    return true;
  };
  M.loadState = function (st, o) {
    o = o || {};
    try { if (GG.save.migrate) st = GG.save.migrate(st) || st; } catch (e) { console.warn('[main] migrate failed', e); }
    if (o.slot && o.slot !== 'auto') st.slot = String(o.slot);   // autosaves keep going to the slot you loaded
    ui.closeAll();
    setState(st);
    GG.emit('career:loaded', { state: st });
    M.route();
    return st;
  };
  M.quitToTitle = function () {
    ui.closeAll();
    setState(null);
    ui.show('title');
  };

  /* ---- Week flow ------------------------------------------------------------------------------------- */
  M.enterGarage = function () { ui.closeAll(); M.sync(); updatePause(); M.route(); };
  // Puts the UI where the saved phase says the career is.
  M.route = function () {
    var st = GG.state;
    if (!st) { ui.show('title'); return; }
    if (st.phase === 'ended' || st.ended) ui.show('end');
    else if (st.phase === 'monday') { if (!st.card) M.beginWeek(); else if (!st.card.resolved) ui.show('card'); }
    else if (st.phase === 'wrap') M.wrapWeek();
    M.sync();
  };
  // Draws this week's Monday card (or a quiet week) and shows it.
  M.beginWeek = function () {
    var st = GG.state; if (!st || st.phase === 'ended') return;
    var res = GG.career.startWeek(st) || {};
    M.sync();
    if (st.card && !st.card.resolved) { ui.show('card'); return; }   // offers show up on the whiteboard
    var q = typeof st.quiet === 'string' ? st.quiet : ui.pick(GG.content.lines && GG.content.lines.quietWeek);
    ui.toast(fill(q) || 'Quiet week. Suspiciously quiet.', { who: 'Quiet week' });
    if (res.offer) ui.toast('📨 A gig offer came in for this weekend. Check the whiteboard.');
  };
  // After the Monday card: week one teaches the garage, in character.
  M.afterCard = function () {
    M.sync();
    var st = GG.state;
    if (st && st.totalWeek === 1 && !M._taught) {
      M._taught = true;
      var mate = st.members && st.members[0] ? ui.who(st.members[0].id) : null;
      var who = mate ? (mate.nick || mate.short) : 'The band';
      ui.toast(M.renderOk ? 'Tap the floor to walk around. Tap the whiteboard (or the big button) to plan the week.'
        : 'Tap the whiteboard (or the big button) to plan the week.', { who: who, ms: 6500 });
    }
  };
  // Results → wrap. Runs endWeek once (phase 'wrap'); a second call just re-shows the same wrap.
  M.wrapWeek = function () {
    var st = GG.state; if (!st) return;
    var wrap = st.wrap;
    if (st.phase === 'wrap') { M.lastSave = null; wrap = GG.career.endWeek(st); }
    M.sync();
    ui.close('results');
    if (wrap) ui.show('wrap', { wrap: wrap }); else M.route();
  };
  M.nextWeek = function () {
    var st = GG.state; if (!st) return;
    ui.close('wrap');
    if (st.phase === 'ended' || st.ended) { ui.show('end'); return; }
    M.route();
  };

  /* ---- Boot ------------------------------------------------------------------------------------------ */
  function query() {
    var out = {};
    (location.search || '').replace(/^\?/, '').split('&').forEach(function (kv) {
      if (!kv) return; var p = kv.split('='); out[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '1');
    });
    return out;
  }
  function onVisibility() {
    if (GG.audio) { if (document.hidden) GG.audio.suspend(); else GG.audio.resume(); }
    updatePause();
  }
  function unlockAudio() { if (GG.audio) GG.audio.unlock(); }

  M.boot = function () {
    if (M.booted) return;
    M.booted = true;
    var bootEl = document.getElementById('boot');
    if (bootEl && bootEl.parentNode) bootEl.parentNode.removeChild(bootEl);
    ui.init();
    var scene = document.getElementById('scene');
    if (GG.render && typeof GG.render.init === 'function') {
      try { M.renderOk = !!GG.render.init(scene); } catch (e) { M.renderOk = false; console.error('[main] render.init failed', e); }
    }
    ui.initWeek();
    if (!M.renderOk) ui.showFallback(scene);
    ['pointerdown', 'touchend', 'keydown'].forEach(function (ev) { document.addEventListener(ev, unlockAudio, true); });
    document.addEventListener('visibilitychange', onVisibility);
    updatePause();
    var q = query();
    if (q.quick) M.quickStart({ seed: q.seed != null ? Number(q.seed) : undefined, slot: q.slot || '1', name: q.name || 'Tester' });
    else ui.show('title');
  };

  GG.registerDebug('main', function () {
    var st = GG.state;
    return { booted: M.booted, renderOk: M.renderOk, slot: st ? st.slot : null, phase: st ? st.phase : null,
      totalWeek: st ? st.totalWeek : null, lastSave: M.lastSave };
  });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', M.boot);
  else M.boot();
})(window.GG);

</script>
