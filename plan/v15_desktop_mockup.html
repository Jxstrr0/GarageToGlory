<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Desktop mockup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- v1.5 "Desktop" PC layout mockup. ?opt=A (Stage + sidebar) or ?opt=B (Centred wide column); &s=1..4 shows one 1440x900
     screen alone; &full=1 keeps the contact sheet at 100 % (otherwise it zooms to fit the window). 3D views are real renders
     of the game (v1.4) at PC sizes, with the UI drawn on top here. -->
<style>
:root{--bg:#0f1420;--bg2:#161d2e;--panel:#1c2438;--panel2:#243050;--line:#34426a;--text:#f3efe6;--dim:#a9b1c6;--faint:#6f7a96;
--amber:#ffb347;--red:#e0403a;--green:#57c77a;--blue:#4f8cff;--purple:#9b6bff;--good:#57c77a;--bad:#ff6b5e;
--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--display:"Arial Black","Helvetica Neue",Impact,system-ui,sans-serif;
--kick:#ff6b4a;--snare:#ffd23f;--hat:#3cd0c0;--crash:#b98cff;--toms:#57c77a;--ride:#4f8cff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05070c;color:var(--text);font:16px/1.4 var(--font)}
.wrap{padding:28px 32px 30px;width:2976px;transform-origin:0 0}
.top h1{font:900 30px var(--display);text-transform:uppercase;letter-spacing:.02em}
.top .sub{color:var(--dim);font-size:18px;margin:6px 0 22px;max-width:2400px}
.sheet{display:grid;grid-template-columns:1440px 1440px;gap:26px 32px}
.cap{color:var(--amber);font:900 16px var(--display);text-transform:uppercase;letter-spacing:.08em}
.capd{color:var(--dim);font-size:16px;margin:3px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame{width:1440px;height:900px;position:relative;overflow:hidden;background:var(--bg);border-radius:12px;box-shadow:0 0 0 1px #26304a}
.foot-note{color:var(--dim);font-size:17px;margin-top:22px}
.foot-note b{color:var(--text)}
body.single{background:var(--bg)}
body.single .wrap{padding:0;width:1440px}
body.single .frame{border-radius:0;box-shadow:none}
.abs{position:absolute}
.img{position:absolute;inset:0;background-repeat:no-repeat}
/* ---- shared bits (tokens = src/00_shell.html) ---- */
.caps{text-transform:uppercase;letter-spacing:.1em;font-weight:800;font-size:12px;color:var(--faint)}
.ttl{font:900 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.dim{color:var(--dim)}.faint{color:var(--faint)}.amber{color:var(--amber)}.good{color:var(--good)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1 1 auto;min-width:0}
.k{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 8px;border-radius:7px;background:linear-gradient(#fbf8f1,#d6cfc0);color:#151b29;
 font:800 14px/1 var(--font);box-shadow:0 3px 0 #8e8778,0 4px 10px rgba(0,0,0,.35);white-space:nowrap;letter-spacing:.02em}
.k.w{min-width:66px}.k.xw{min-width:92px}
.k.lg{height:36px;min-width:36px;font-size:16px;border-radius:8px;box-shadow:0 4px 0 #8e8778,0 6px 14px rgba(0,0,0,.4)}.k.lg.w{min-width:72px}
.k.sm{height:22px;min-width:22px;padding:0 6px;font-size:12px;border-radius:5px;box-shadow:0 2px 0 #8e8778}
.k.dk{background:#2b3658;color:var(--text);box-shadow:0 2px 0 #0b0f18;border:1px solid #42517e}
.hints{display:flex;gap:18px;align-items:center;color:var(--dim);font-size:14px;font-weight:600;flex-wrap:wrap}
.hints>span{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.focus{outline:3px solid var(--amber)!important;outline-offset:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);
 background:var(--panel2);color:var(--text);font:800 15px/1.1 var(--font);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.btn.big{min-height:58px;font-size:17px;border-radius:14px}
.btn.primary{background:var(--amber);color:#1d1204;border-color:#ffc978;box-shadow:0 4px 0 #b3661a,0 10px 24px rgba(255,179,71,.18)}
.btn.primary .k{box-shadow:0 2px 0 #9a6a2c;background:linear-gradient(#fff6e6,#f3dcb5)}
.btn.off{background:#6a5638;color:#2a2116;border-color:#7a6545;box-shadow:none}
.btn.ghost{background:transparent}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--dim);font-size:20px;flex:none;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font:700 13px/1.3 var(--font);background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim)}
.hudc{flex:1 1 0;min-width:0;min-height:52px;padding:6px 4px 5px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(15,20,32,.86);
 display:flex;flex-direction:column;align-items:center;justify-content:center}
.hudc .l{font:800 10px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.hudc .v{font:800 16px/1.2 var(--font);white-space:nowrap}.hudc .v small{font-size:11px;color:var(--faint)}
.hudc.week .v{color:var(--amber)}
.hudc .bar{width:70%;height:4px;border-radius:2px;background:#2a3350;margin-top:3px;position:relative;overflow:hidden}
.hudc .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.hudi{flex:0 0 52px;min-height:52px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(15,20,32,.86);display:grid;place-items:center;font:800 20px var(--font)}
.wx{display:flex;justify-content:center;gap:6px;align-items:center;border-radius:999px;background:rgba(15,20,32,.86);border:1px solid rgba(255,255,255,.08);
 padding:5px 14px;font:700 14px var(--font);color:var(--text);white-space:nowrap}
.wx .a{color:var(--amber)}
.pill{position:absolute;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;background:rgba(15,20,32,.92);border:1px solid #f0b04c;font:700 14px var(--font)}
.side{position:absolute;top:0;bottom:0;right:0;background:linear-gradient(180deg,#202a42 0%,var(--panel) 150px);border-left:1px solid var(--line);box-shadow:-14px 0 40px rgba(0,0,0,.45);display:flex;flex-direction:column}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px}
.booked{background:linear-gradient(135deg,#2c2733,#1f2336);border:1px solid #5b4a3a;border-radius:14px;padding:14px 16px;display:flex;gap:14px}
.booked .mic{font-size:28px;line-height:1}
.booked b{font-size:19px;display:block}
.slot{border:2px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:rgba(255,255,255,.015)}
.slot .d{font:800 11px var(--font);letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.slot .n{font-weight:800;font-size:15px}
.slot.sel{border-color:var(--amber)}
.slot.fill{border:1.5px solid #4a5a8a;background:var(--panel2)}
.act{background:var(--bg2);border:1px solid var(--line);border-radius:14px;display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.act .e{font-size:26px;line-height:1.1;flex:none}
.act b{display:block;font-size:16px}.act span{display:block;font-size:13px;color:var(--dim);line-height:1.35}
.tabs{display:flex;gap:4px;border-bottom:1px solid #2a3452}
.tab{padding:11px 14px 10px;font-weight:900;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-bottom:3px solid transparent;text-align:center}
.tab.on{color:var(--text);border-color:var(--amber)}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px;border:1px solid #26304a}
.seg div{flex:1;text-align:center;white-space:nowrap;padding:9px 8px;border-radius:9px;font-size:13px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.seg .on{background:var(--panel2);color:var(--text)}
.seg .amb{background:var(--amber);color:#1d1204}
.meters{display:flex;gap:16px}
.m{flex:1;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.m b{color:var(--text);font-size:15px;min-width:20px;text-align:right}.m i{flex:1;height:5px;border-radius:3px;background:#2a3350;position:relative;overflow:hidden}
.m i::after{content:"";position:absolute;inset:0;width:var(--v);background:var(--c);border-radius:3px}
.coach{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;background:var(--bg2);border-radius:22px;font-size:15px;color:var(--dim);border:1px solid #232c45}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;color:#10141f;flex:none}
.coach strong{color:var(--text)}
.krow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 0;border-radius:12px;background:var(--bg2);border:1px solid #26304a;overflow:hidden}
.krow .bar{width:6px;align-self:stretch;border-radius:0 4px 4px 0}
.krow .e{font-size:22px;width:30px;text-align:center}
.krow b{font-size:16px;display:block}.krow small{font-size:12px;color:var(--faint);display:block}
.krow.dimmed{opacity:.62}
.krow.wait{border:2px solid var(--amber);background:#2a2a35}
.press{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:9px;background:rgba(255,179,71,.14);border:1.5px dashed var(--amber);color:var(--amber);font-weight:800;font-size:14px;white-space:nowrap}
.note-box{border-radius:12px;padding:10px 14px;background:rgba(255,179,71,.08);border:1px solid rgba(255,179,71,.35);font-size:13.5px;color:var(--dim);line-height:1.4}
.note-box b{color:var(--text)}
/* highway */
.hw{position:absolute;overflow:hidden}
.lane-sep{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.06)}
.beat{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.05)}
.gem{position:absolute;height:18px;border-radius:9px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 14px var(--glow)}
.hitline{position:absolute;left:0;right:0;height:3px;background:rgba(243,239,230,.55);box-shadow:0 0 12px rgba(255,255,255,.35)}
.tgt{position:absolute;height:24px;border-radius:12px;border:2px solid var(--c);background:rgba(0,0,0,.25)}
.tgt.lit{background:var(--c);box-shadow:0 0 28px var(--c),0 0 6px var(--c)}
.judge{position:absolute;font:900 34px var(--display);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 14px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.9)}
.lname{font:900 12px var(--font);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.bubble{position:absolute;background:#fff;color:#c62c2c;font:900 22px var(--display);padding:4px 12px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.bubble::after{content:"";position:absolute;left:18px;bottom:-9px;border:6px solid transparent;border-top:8px solid #fff}
/* songwriter grid */
.c{border-radius:7px;background:#161d30}.c.bt{background:#1c2439}
.c.on{background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.gh{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;text-align:center;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:5px}
.bl{font-size:12px;font-weight:900;color:var(--faint);display:grid;place-items:center}.bl.b{color:var(--text);font-size:14px}
.tl{display:flex;gap:5px}
.tb{flex:var(--w,1);height:40px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:900;text-transform:uppercase;color:#10141f;opacity:.5;letter-spacing:.04em}
.tb.on{opacity:1;outline:2px solid var(--text);outline-offset:2px}
/* keyboard map */
.kb{display:flex;flex-direction:column;gap:8px}
.kb .r{display:flex;gap:8px}
.key{height:58px;width:58px;border-radius:9px;background:#222b42;border:1px solid #33405f;box-shadow:0 3px 0 #0b0f18;display:flex;flex-direction:column;align-items:center;justify-content:center;
 font:800 16px var(--font);color:#8b94ad;flex:none}
.key small{font:800 9px var(--font);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.key.res{background:repeating-linear-gradient(135deg,#1a2133 0 6px,#1e263a 6px 12px);color:#59627c}
.key.on{color:#10141f;border-color:transparent;box-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px var(--c);background:var(--c)}
.key.wait{background:#2a2a35;border:2px dashed var(--amber);color:var(--amber)}
.dots{display:flex;gap:10px}.dots i{width:16px;height:16px;border-radius:50%;background:#2a3350;display:block}.dots i.on{background:var(--amber)}
</style></head><body>

function highway(o) {   // o: { w, h, lanes, laneW, hitY, step, first, tgtH, bg, caps: 'below'|'button' }
  let h = `<div class="hw" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;background:${o.bg};border-radius:${o.r || 0}px;${o.border || ''}">`;

function grid(o) {   // songwriter grid. o: { rows: 'lanes'|'steps', cellW, cellH, headW, gap, focus: [lane, step], play: step }
  const P = ['x.x.x.x.x.x.x.x.', '....x.......x...', 'x.x.x.x.x.x.x.x.', 'x...............', '..............xx', '......x.......x.'];

    h += '<div></div>' + L.map(l => `<div class="gh" style="color:${l.c};background:${l.c}22">${l.e} ${l.n}</div>`).join('');
    for (let s = 0; s < 16; s++) {
      h += `<div class="bl ${s % 4 ? '' : 'b'}" style="${s === o.play ? 'color:var(--amber)' : ''}">${s % 4 ? BL[s % 4] : (s / 4 + 1)}</div>`;
      L.forEach((l, li) => {

      <div style="height:4px;border-radius:2px;background:#232c45;margin-top:12px"><div style="width:41%;height:100%;border-radius:2px;background:var(--amber)"></div></div>
      <div class="hints" style="margin-top:12px;font-size:13px"><span>${kc('Esc', 'sm dk')} pause</span></div></div>`;
  },
  s3() {
    return `<div class="img" style="background:radial-gradient(90% 70% at 50% 0%,#1a2340 0%,var(--bg) 65%)"></div>
    <div class="abs" style="left:160px;width:1120px;top:18px">
      <div class="row"><div class="ic">✕</div><div class="grow"><div class="caps">Write block 1 of 1 · Drums</div><div style="font-weight:900;font-style:italic;font-size:22px">Le Pacte du Semis</div></div>
        <div class="hints" style="margin-right:8px">${kc('Esc', 'sm dk')} close</div><div class="ic">⋯</div></div>
      <div style="display:grid;grid-template-columns:380px 1fr;gap:28px;margin-top:16px">
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="tabs"><div class="tab" style="flex:1">Verse</div><div class="tab on" style="flex:1">Chorus</div><div class="tab" style="flex:1">Bridge</div><div class="tab" style="flex:1">Song</div></div>
          <div class="meters"><div class="m">Groove<i style="--v:67%;--c:var(--amber)"></i><b>67</b></div><div class="m">Hook<i style="--v:59%;--c:var(--amber)"></i><b>59</b></div><div class="m">Diff<i style="--v:37%;--c:var(--blue)"></i><b>37</b></div></div>
          <div class="coach" style="align-items:flex-start;border-radius:16px;padding:10px 14px 10px 10px"><div class="av" style="background:#ffb347">D</div><span><strong>Dana:</strong> Kick first, the rest follows. A crash on the one makes a chorus feel bigger.</span></div>
          <div class="caps" style="margin-top:4px">This section</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div class="btn" style="font-size:13px">⧉ Copy to…</div><div class="btn" style="font-size:13px">🧽 Clear</div>
            <div class="btn" style="font-size:13px">🥁 Fill on bar 4</div><div class="btn" style="font-size:13px">🎲 Swap a beat</div></div>
          <div class="caps" style="margin-top:4px">Feel</div>
          <div class="seg"><div class="on">Straight</div><div>Light swing</div><div>Swing</div></div>
          <div class="caps" style="margin-top:4px">Song order</div>
          <div class="tl">${[['V', '#57c77a', 2], ['C', '#ffb347', 1.4], ['V', '#57c77a', 2], ['C', '#ffb347', 1.4], ['B', '#9b6bff', 1], ['C', '#ffb347', 1.4]].map((t, i) => `<div class="tb ${i === 1 ? 'on' : ''}" style="background:${t[1]};--w:${t[2]};height:34px">${t[0]}</div>`).join('')}</div>
          <div class="row" style="padding:6px 10px;border-radius:14px;background:var(--bg2);border:1px solid #26304a"><div class="ic" style="width:38px;height:38px">−</div><b style="font:900 22px var(--display)">172</b><span class="dim grow" style="font-size:14px">bpm · Fast</span><div class="ic" style="width:38px;height:38px">+</div></div>
          <div class="note-box" style="background:rgba(79,140,255,.07);border-color:rgba(79,140,255,.3)">
            <div class="hints" style="gap:10px 16px;font-size:13.5px"><span>${kc('←', 'sm dk')}${kc('→', 'sm dk')} drum</span><span>${kc('↑', 'sm dk')}${kc('↓', 'sm dk')} step</span><span>${kc('Space', 'sm dk')} add / remove</span><span>${kc('Tab', 'sm dk')} leave the grid</span></div></div>
        </div>
        <div style="padding:14px 14px 12px 6px;border-radius:16px;background:rgba(10,14,24,.6);border:1px solid #232c45">${grid({ rows: 'steps', cellH: 36, gap: 4, focus: [1, 12], play: 6 })}</div>
      </div>
      <div style="display:grid;grid-template-columns:380px 1fr;gap:28px;margin-top:18px">
        <div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:12px"><div class="btn big">▶ Loop</div><div class="btn big">▶ Song</div><div class="btn big primary">Save ✓</div></div></div>
    </div>`;
  },
  s4() {
    const rail = ['🥁 Play', '⌨️ Keys', '🔊 Audio + timing', '🎨 Look + feel', '💾 Saves'];
    return `<div class="img" style="background:radial-gradient(90% 70% at 50% 0%,#1a2340 0%,var(--bg) 65%)"></div>
    <div class="abs" style="left:150px;width:1140px;top:22px">
      <div class="row"><div class="btn ghost" style="min-height:44px;padding:0 14px">‹ Back ${kc('Esc', 'sm dk')}</div><div class="grow ttl" style="text-align:center">Settings</div><div style="width:150px"></div></div>
      <div style="display:grid;grid-template-columns:210px 1fr 1fr;gap:22px;margin-top:20px">
        <div style="display:flex;flex-direction:column;gap:6px">${rail.map((r, i) => `<div style="padding:13px 16px;border-radius:12px;font-weight:800;font-size:15px;${i === 1 ? 'background:var(--panel2);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--amber)' : 'color:var(--dim)'}">${r}</div>`).join('')}</div>
        <div style="padding:18px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line)">
          <div class="caps amber">Your keys</div>
          <div class="seg" style="margin-top:10px"><div class="on">🥁 Drum kit</div><div>🎸 Bass + guitars</div></div>
          <div class="dim" style="font-size:14px;margin:12px 0 10px">Click a drum (or press Enter on it), then press its new key. Two drums never share a key: they swap.</div>
          <div style="display:flex;flex-direction:column;gap:8px">${keyRows(-1, 1)}</div>
          <div class="note-box" style="margin-top:12px">⚠ <b>Shift is one of your keys.</b> On Windows, pressing it 5 times in a row can pop up “Sticky Keys”: pick <b>No</b> and it won’t ask again.</div>
          <div class="btn" style="margin-top:12px;font-size:13px">↺ Reset to Space D F S Shift A</div>
        </div>
        <div style="padding:18px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column">
          <div class="caps amber">Key timing</div>
          <div class="seg" style="margin-top:10px"><div class="on">🔊 Speaker</div><div>🎧 Headphones</div></div>
          <div style="font-weight:800;font-size:19px;margin-top:14px">Press any key on each click</div>
          <div class="dim" style="font-size:14px;margin-top:4px">Keyboards and speakers each add a little delay. This lines up the clock; the timing windows and grades stay the same as touch.</div>
          <div style="display:grid;place-items:center;margin:22px 0 14px;position:relative;height:200px">
            <div style="position:absolute;width:200px;height:200px;border-radius:50%;border:2px solid rgba(255,179,71,.18)"></div>
            <div style="position:absolute;width:160px;height:160px;border-radius:50%;border:3px solid rgba(255,179,71,.4)"></div>
            <div style="width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffd08a,var(--amber));box-shadow:0 0 40px rgba(255,179,71,.5);display:grid;place-items:center;color:#1d1204;font:900 34px var(--display)">5</div></div>
          <div class="row" style="justify-content:center"><div class="dots">${Array.from({ length: 8 }, (_, i) => `<i class="${i < 5 ? 'on' : ''}"></i>`).join('')}</div></div>
          <div class="center dim" style="text-align:center;margin-top:10px;font-size:15px">5 of 8 · so far <b style="color:var(--text)">21 ms late</b></div>
          <div style="margin:18px 6px 0;position:relative;height:44px">
            <div style="position:absolute;left:0;right:0;top:14px;height:4px;border-radius:2px;background:#2a3350"></div>
            <div style="position:absolute;left:50%;top:4px;width:2px;height:24px;background:var(--text);opacity:.7"></div>
            ${[53, 57, 61, 65, 69].map(x => `<i style="position:absolute;left:${x}%;top:11px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--amber);opacity:.85"></i>`).join('')}
            <div class="row" style="position:absolute;left:0;right:0;top:28px;justify-content:space-between;font-size:12px;color:var(--faint);font-weight:700"><span>early</span><span>on the click</span><span>late</span></div></div>
          <div class="dim" style="font-size:13px;margin-top:14px">Touch keeps its own timing; this one is for keys only.</div>
          <div style="margin-top:auto" class="btn">Stop ${kc('Esc', 'sm dk')}</div>
        </div>
      </div>
      <div class="hints" style="justify-content:center;margin-top:18px"><span>${kc('↑', 'sm dk')}${kc('↓', 'sm dk')} move</span><span>${kc('Tab', 'sm dk')} next panel</span><span>${kc('Enter', 'sm dk')} change key</span><span>${kc('Esc', 'sm dk')} back</span></div>
    </div>`;
  }
};

const q = new URLSearchParams(location.search), opt = (q.get('opt') || 'A').toUpperCase() === 'B' ? 'B' : 'A', O = opt === 'A' ? A : B, one = +q.get('s');
const W = document.getElementById('wrap');
if (one >= 1 && one <= 4) { document.body.className = 'single'; W.innerHTML = `<div class="frame">${O['s' + one]()}</div>`; }
else {
  W.innerHTML = `<div class="top"><h1>${O.name}</h1><div class="sub">${O.sub}</div></div>
  <div class="sheet">${[1, 2, 3, 4].map(i => `<div><div class="cap">${O.caps[i - 1][0]}</div><div class="capd">${O.caps[i - 1][1]}</div><div class="frame">${O['s' + i]()}</div></div>`).join('')}</div>
  <div class="foot-note"><b>Default keys (you can change every one):</b> drums Space kick · D snare · F hats · S crash · Shift toms · A ride; bass and guitars A S D F low to high, then Space (5 strings) or Shift + Space (6).
  Phones keep today’s layout exactly. Screens drawn at 1440 × 900; the 3D views are real renders of the game.</div>`;
  if (!q.get('full')) { const fit = () => { const z = Math.min(1, innerWidth / 2976); W.style.transform = z < 1 ? `scale(${z})` : ''; document.body.style.height = z < 1 ? W.offsetHeight * z + 'px' : ''; }; addEventListener('resize', fit); fit(); }
}
</script></body></html>
